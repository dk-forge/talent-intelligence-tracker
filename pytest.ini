[pytest]
# Tests import `pipeline` and `source_registry` from the repo root. Bare
# `pytest` does not put the root on sys.path (only `python -m pytest` does),
# so state it explicitly and let both invocations work.
#
# `tests` is on the path too, so shared test helpers (tests/phpsource.py) import
# as plain `phpsource`. pytest usually adds a test file's own directory to
# sys.path anyway, but only as a side effect of prepend import mode, and relying
# on that would make the imports depend on how pytest is invoked and on which
# version. Say it.
pythonpath = . tests
testpaths = tests
