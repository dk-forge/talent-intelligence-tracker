name: health digest

# The alert that reaches a human.
#
# Health has been recorded since day one and never announced. This reads the
# ledger once a week and emails the owner only when something needs them: a
# collector that died, or a pipeline that stopped entirely. Silence means fine.
#
# This job stays GREEN when it finds problems. The email is the alert; a red
# weekly run on top of it would only teach the owner to ignore a red weekly run.
# It fails only when the digest itself cannot run, which is a real failure of
# the alerting and must be loud.
#
# The Monday schedule also keeps this repository active, which matters more than
# it looks: GitHub disables scheduled workflows after 60 days without repository
# activity, and the collect cron committing the database is the only thing
# keeping that clock reset today. If collection ever stops, this run is what
# still fires and says so.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Classify and print, send no email'
        type: boolean
        default: false
      send_test:
        description: 'Send a test alert whatever the findings, to prove the mail path'
        type: boolean
        default: false
      local:
        description: 'Read the committed database instead of the live endpoint'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      - name: Run the digest
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The relay that carries operational mail. It is deliberately NOT on
          # the host these alerts are about: see opsmail.py. Without it the job
          # is green and its mail is silent, which is why
          # tests/test_ops_sender.py fails when a mailing job lacks it.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Travels WITH the key, always. It is unset today, so opsmail's
          # default applies everywhere; the day it is set, a job that does not
          # carry it keeps the old From and the owner has two identities to
          # filter. That is the defect this whole change exists to close.
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python health_digest.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.send_test && '--send-test' || '' }} \
            ${{ inputs.local && '--local' || '' }}
