name: ab-models

# Compare candidate models on real captured headlines. Read-only: writes nothing
# to the database and posts nothing to WordPress. Costs a few cents.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to compare'
        type: choice
        options: [gate, readthrough]
        default: gate

jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Compare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python ab_models.py ${{ inputs.mode == 'readthrough' && '--readthrough' || '' }}
