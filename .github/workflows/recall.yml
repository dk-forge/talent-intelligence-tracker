# Measure what we miss, on a schedule, and commit the dated result.
#
# WEEKLY, Mondays 08:00 UTC. The cadence is a judgement, so here is the
# reasoning rather than a bare number:
#
#   - The run is read-only against the live API but it is ~180 requests to
#     shared hosting, which is not something to do daily for a number that
#     cannot move that fast.
#   - Recall against a CLOSED window genuinely does keep moving for a few weeks
#     as late write-ups and backfills land, so weekly shows real convergence
#     rather than noise. Once it stops moving, that plateau is itself the signal
#     that a fresh gold set is due, and the run says so.
#   - It matches the health digest's weekly rhythm, so the owner reads one
#     cadence rather than two.
#
# The result is committed, never only printed: a recall figure that exists in a
# job log and nowhere else cannot be plotted, cannot be re-derived, and cannot
# be contradicted.
name: recall

on:
  schedule:
    - cron: '0 8 * * 1'      # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also write the public page data file'
        type: boolean
        default: true

# ONE lock for every workflow that writes data/talent_intel.db. This job files
# its run in the source_health table, which makes it a database writer, and a
# writer outside the group is a writer with no lock: every writer here ends with
# reset-to-origin then copy-our-file-back, so two of them running at once means
# whichever pushes second silently destroys the other's rows.
# Enforced by tests/test_workflows.py::test_every_database_writer_shares_one_lock.
concurrency:
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The locks are keyed separately on
          # purpose: a light job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # The gold set is checked before the API is touched. An invalid reference
      # set produces a wrong denominator, and a wrong recall number is worse
      # than no recall number.
      - name: Check every gold set
        run: |
          python measure_recall.py --family world --check
          python measure_recall.py --family us --check

      # --push is what makes this visible. The committed file is only the seed
      # the plugin ships with, and the plugin deploy is deliberately NOT armed
      # on push, so a file-only run would leave the page showing its
      # shipping-day figure while newer ones accumulated in the repository. The
      # page prefers a pushed measurement over the file for exactly this reason.
      - name: Measure
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          python measure_recall.py --family world --quiet --push \
            ${{ inputs.publish == false && ' ' || '--publish' }}

      # The United States, measured separately against its own reference set.
      #
      # A SECOND STEP AND NOT A SECOND WORKFLOW. Both populations read the same
      # API in the same run, file into the same health ledger and commit under
      # the same `talent-collect` lock, so a second workflow would be a second
      # database writer racing this one for a lock it already holds, which is
      # the eviction this repository has been bitten by thirteen times.
      #
      # This step is allowed to fail the job, and the first draft of it was not.
      # It carried a skip-on-failure flag, reasoning that a US failure should
      # not throw away the worldwide measurement. It cannot: the worldwide step
      # has already pushed by the time this runs, and the commit step below is
      # `if: !cancelled()`, so nothing is lost either way. All that flag would
      # have bought is a US quality gate that goes red and shows green, which
      # tests/test_recall_thresholds.py rejects by name and duly did.
      - name: Measure the United States
        if: ${{ !cancelled() }}
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          python measure_recall.py --family us --quiet --push \
            ${{ inputs.publish == false && ' ' || '--publish' }}

      # WHY the misses are misses, beside the measurement that counts them.
      #
      # A recall figure says how much we hold. It cannot say whether the gap is
      # a filter, a missing source or a young corpus, and those three have
      # nothing in common as work: one is a code change, one is a feed, one is
      # only time. The audit splits them, and its most useful number is a zero
      # (`fetched_then_dropped`), which is the kind of number nobody computes
      # unless something computes it for them.
      #
      # Costs nothing: no model, no network, reads the committed database and
      # the same sealed gold set. Run AFTER the measurement so it audits the
      # corpus the measurement just scored, and never fatal -- an audit that
      # failed is a lost diagnosis, while a failed step here would throw away
      # the recall measurement that is the point of the job.
      # One per family, because the answer differs by family: the worldwide
      # misses are spread across publishers with no feed, and the US ones are
      # almost entirely days a rationed walker has already finished. Auditing
      # only the worldwide set would have said nothing about either.
      - name: Audit why the misses are misses
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python -m analysis.recall.rejection_audit --family world --write
          python -m analysis.recall.rejection_audit --family us --write

      # Push the run into the site's health ledger so the health page shows the
      # measurement's own state. Never fatal: a stale health timestamp is a much
      # smaller problem than a lost measurement, which is already on disk by now.
      - name: Publish health
        if: ${{ always() }}
        continue-on-error: true
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          python - <<'PY'
          from pipeline import publish, schema
          print("health rows sent:", publish.publish_health(schema.connect()))
          PY

      # Same shape as collect.yml, and for the same reason: this job checks out
      # main, works for several minutes, then pushes, and any push to main in
      # that window rejects it. Rebasing a SQLite file is not sensible, so this
      # does not try — it resets to the remote and MERGES the database in with
      # merge_db.py.
      #
      # The measurement files around it stay whole-file copies, which is right:
      # they are snapshots with no row identity to merge on. The database is not
      # one of those, and treating it as one destroyed 9,572 rows and the whole
      # identity cache on 2026-07-28/29. The concurrency group does not make a
      # copy safe: it cannot see a human pushing from a laptop, and a run it
      # queues is stale by exactly as long as it waited (see merge_db.py).
      - name: Commit the measurement
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'

          db=data/talent_intel.db
          # Snapshot files, copied back whole. The database is handled separately
          # below because it is the one thing here that merges.
          paths="analysis/recall/results analysis/recall/us/results data/recall_worklist.json data/recall_us_worklist.json data/recall_rejection_audit.json data/recall_us_rejection_audit.json wordpress-plugin/talent-intelligence-tracker/data/recall.json wordpress-plugin/talent-intelligence-tracker/data/recall-us.json"
          git add $paths $db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/keep"
          for p in $paths $db; do
            if [ -e "$p" ]; then
              mkdir -p "$RUNNER_TEMP/keep/$(dirname "$p")"
              cp -R "$p" "$RUNNER_TEMP/keep/$(dirname "$p")/"
            fi
          done

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/keep/$db" "$db"
            for p in $paths; do
              if [ -e "$RUNNER_TEMP/keep/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp -R "$RUNNER_TEMP/keep/$p" "$(dirname "$p")/"
              fi
            done
            git add $paths $db 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Remote already has this measurement."
              exit 0
            fi
            git commit -q -m "recall: measured $(date -u +%Y-%m-%d)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the measurement after 5 attempts. \
          This run's result exists only on the runner and is lost."
          exit 1

      # A fresh gold set cannot be produced by this workflow, and pretending
      # otherwise is how a benchmark drifts into self-congratulation. When one
      # is due the run says so loudly in the log and in the work list, and the
      # health entry goes degraded so the weekly digest carries it to the owner.
      - name: Say whether a fresh gold set is due
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json, os
          for label, path in (("worldwide", "data/recall_worklist.json"),
                              ("United States", "data/recall_us_worklist.json")):
              if not os.path.exists(path):
                  print(f"::warning::no {label} work list: nothing measured that "
                        f"population this run, which is UNKNOWN and not a pass")
                  continue
              with open(path) as fh:
                  work = json.load(fh)
              due = work["next_goldset"]
              if due["due"]:
                  window = due["suggested_window"]
                  print(f"::warning::A fresh {label} gold set is due. {due['reason']}")
                  print(f"::warning::Window to cover: {window['start']} to {window['end']}")
                  print(due["instruction"])
              else:
                  print(f"{label} gold set still current:", due["reason"])
          PY
