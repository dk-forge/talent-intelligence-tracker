name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # SIZED FROM MEASUREMENT, 2026-08-13: median 3.5 min, max 5.1 over the last
    # 38 successful runs, and the spread is narrow (3.0 to 5.1). 15 is ~3x the
    # maximum and ~4x the median, which is the same ceiling the sibling repo's
    # identical pytest job carries. Generous for a suite this steady, because
    # this one gates every PR: a red here from a slow runner is a wolf cried at
    # the person least able to ignore it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r $GITHUB_WORKSPACE/requirements-dev.lock

      # A PHP parse error is the one plugin mistake the host cannot absorb.
      # tit_require() guards a MISSING file, but a file that is present and
      # unparseable fatals the whole plugin on every request, taking the
      # dashboard, the sources page and every company profile with it. Nothing
      # in the Python suite can see that, and the deploy is an FTP upload with
      # no syntax check of its own. So it is checked here, where it blocks a
      # deploy instead of following one.
      - name: Lint the plugin's PHP
        run: |
          php -v
          find wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      # Linting proves a file parses, not that it renders. The recall page's
      # trend chart only draws once there are two measurements, so on the day it
      # shipped there was no way to see it on the live page without publishing a
      # fabricated second point. This renders it with synthetic points instead.
      - name: Render the recall page's chart
        run: php tests/php/render_recall.php

      # Correcting an employer's company_key moves its /company/ URL, and three
      # of the URLs that moved were in the sitemap. Whether the old one 301s or
      # 404s is a behaviour across a state change, which no amount of reading
      # the source proves, so the routing runs here against real SQL.
      - name: Route company slugs through a key correction
        run: php tests/php/route_company_slugs.php

      # A country, city or industry page exists only if its coverage clears the
      # gate, and what a URL below the gate ANSWERS is a status code across a
      # change of state that no amount of reading the source settles. This also
      # counts the queries one render costs and fails if the number moves: the
      # owner asked for these pages to be fast, and a bound on the work is the
      # only version of that claim a test can hold.
      - name: Render the place pages and count their queries
        run: php tests/php/render_place_pages.php

      # The dashboard is the page every reader lands on, and what it costs is
      # not visible in a diff: the shortcode runs a dozen aggregates over the
      # whole table, and what turns that into a slow page is one innocent query
      # added inside a foreach. This renders it against real SQL, counts the
      # queries cold and warm, and fails if either number moves. It also holds a
      # byte budget on the markup, because the owner asked for this to be fast
      # on a phone and a fourth ranking card is not free.
      - name: Render the dashboard and count its queries and bytes
        # This was a single plain-scalar `run:` whose continuation line YAML
        # joins with a space, so CI was actually running jsonld_xss.php with
        # the dashboard harness path as an ignored argv and the dashboard
        # harness NEVER RAN here. A block scalar runs both.
        run: |
          php tests/php/jsonld_xss.php
          php tests/php/render_dashboard.php

      # The market trend makes the dashboard's one market claim, and the claim
      # is only honest because of what it refuses to count: collectors not live
      # for the whole window. The render harness above can only reach the
      # share variant (its fixture ingests everything within days), so this
      # one seeds controlled ingest dates and proves the counts variant
      # excludes a mid-window flood, the thin panel falls back to shares, and
      # two sparse weeks draw nothing.
      - name: Prove the market trend counts only its fixed panel
        run: php tests/php/market_trend.php

      # /enrich and /correct are the only routes that can change a row a reader
      # is already looking at, and the safety of both is which branch a value
      # takes: an absent field must erase nothing, an explicitly named clear must
      # work and only where it is allowed, and a correction must not reach
      # another collector's rows. None of that is readable in a diff.
      - name: Exercise the enrich and correct write routes
        run: php tests/php/enrich_and_correct.php

      # The sources page explains why most rows carry no archived copy, and the
      # explanation is arithmetic over the whole table: filings whose publishers
      # keep them, versus citations that can be taken down. A sentence with
      # counts in it is true the day it is written, and this one has to stay true
      # while the archived share climbs, so it is rendered against two corpora
      # rather than read. It also holds the page to three queries cold and none
      # warm: the archive split plus the two scans behind the collection-rate
      # chart, which lives on this page since 2026-08-05.
      - name: Render the sources page and check what it claims about the archive
        run: php tests/php/render_sources.php

      # The RSS feed has to satisfy a strict parser for every row we hold, the
      # filtered feed has to honour the filters, and the CRM preset headers are
      # a contract with two import wizards that map columns by name.
      - name: Feed and CRM export presets, run for real
        run: php tests/php/feed_and_crm.php

      - name: Run tests
        run: python -m pytest -q

      # Proves the whole pipeline runs end to end with no network and no LLM
      # spend. If this stops working, a collector or a guard has broken.
      - name: Offline dry run
        run: python run_collect.py --dry-run --offline
