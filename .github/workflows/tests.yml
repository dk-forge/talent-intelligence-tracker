name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 'pytest>=7.0' pyyaml

      - name: Run tests
        run: python -m pytest -q

      # Proves the whole pipeline runs end to end with no network and no LLM
      # spend. If this stops working, a collector or a guard has broken.
      - name: Offline dry run
        run: python run_collect.py --dry-run --offline
