name: adjudicate-rows

# Put live rows a session has flagged to two referees from different vendors,
# and apply only what both agree on. See adjudicate_guardrail.py ("A ROW NO
# CHECK CAUGHT"): `--row` opens amount/<hash>, `--place-row` opens
# place/<hash>, each through guardrails.record with an empty check list, and
# the rest is the guardrail adjudicator unchanged. A disagreement or an
# unreadable source is written to analysis/adjudications/ and applies nothing;
# the run then goes RED ONCE so the owner hears about exactly that and nothing
# else, which is the 2026-09-11 rule.
#
# WHY A WORKFLOW. The checkout that wrote this held no OPENROUTER_API_KEY, and
# the sibling tracker's key through `railway run` charges the sibling's pot
# (TECHLOG 2026-09-12: "none of it is in this repo's ledger"). This runs on
# this repository's own key, meters through classify._call like every other
# paid read, files a priced source_health row (`adjudicate_rows`,
# discretionary), and commits the spec files with the database.
#
# WHY IT IS A WRITER AND HOLDS THE LOCK. accept/reject write publish_guardrails,
# an edit appends a revision through store.revise and corrects the live row in
# place, so it shares `talent-collect` and merges its rows back like
# correct-funding-amount.yml. Queue it, never dispatch it:
#
#   gh workflow run drain-writers.yml -f enqueue=adjudicate-rows.yml \
#     -f inputs_json='{"rows":"<hash>,<hash>","place_rows":"<hash>","reason":"why","dry_run":"false"}' \
#     -f reason='why'
#
# `from_spec` (comma-separated analysis/adjudications/*.json paths) RE-APPLIES
# an already-agreed or an owner-ruled spec through `adjudicate_guardrail.py
# --from-spec`. It calls no referee and needs no OPENROUTER_API_KEY: an
# owner-ruled spec was decided by a human after the referees disagreed, not by
# asking them again. Queue it the same way:
#
#   gh workflow run drain-writers.yml -f enqueue=adjudicate-rows.yml \
#     -f inputs_json='{"from_spec":"analysis/adjudications/<a>.json,analysis/adjudications/<b>.json","dry_run":"false","reason":"why"}' \
#     -f reason='why'
#
# An OWNER-RULED spec may also rename an employer, change a headcount or the
# amount wording, or `"action": "split"` one row into several (TECHLOG
# 2026-09-21). A rename moves the content_hash, so the live row is withdrawn
# through /retract and the replacements are published in this same step, which
# is why it holds WP_SITE_URL and WP_API_KEY. A two-referee spec carrying any of
# that is refused.
#
# PRICE BEFORE, RECORD AFTER. Measured 2026-09-12: $0.016 to $0.030 per row for
# the pair of referees. The ceiling input bounds one run; the month's switch
# (TIT_PAID_READS) is read before every request regardless.
#
# `accept_keys` / `reject_keys` (comma-separated check/subject, e.g.
# `vehicle_name/<hash>`) answer an OPEN finding directly through
# `guardrails.py --accept`/`--reject`, calling no referee and spending
# nothing. This is NOT a shortcut around the two-referee rule for `amount` and
# `place` findings raised by a session (`--row`/`--place-row`/`--key` above
# stay the only door there, per the owner's 2026-09-16 "two agents before the
# owner" ruling). It exists because `adjudicate_guardrail.py`'s prompt only
# ever asks a funding-FIGURE question (PROMPT/RULES) or a PLACE question
# (PLACE_PROMPT) -- there is no vocabulary for "is this issuer name really a
# vehicle", so putting a `vehicle_name` (or `period_totals`/`date_span`)
# finding through `--key` asks the referees the wrong question and their
# answer means nothing. `--note` is required and is exactly what
# `guardrails.py --accept --note` records. Queue it the same way:
#
#   gh workflow run drain-writers.yml -f enqueue=adjudicate-rows.yml \
#     -f inputs_json='{"accept_keys":"vehicle_name/<hash>","note":"why","dry_run":"false"}' \
#     -f reason='why'

on:
  workflow_dispatch:
    inputs:
      from_spec:
        description: 'Comma-separated analysis/adjudications/*.json paths: re-apply an already-agreed or owner-ruled spec, no referee is asked'
        type: string
        default: ''
      rows:
        description: 'content_hash list, comma separated: money rows (amount/<hash>)'
        type: string
        default: ''
      place_rows:
        description: 'content_hash list, comma separated: location rows (place/<hash>)'
        type: string
        default: ''
      keys:
        description: 'check/subject list, comma separated: an EXISTING open finding of any check (e.g. vehicle_name/<hash>). --row/--place-row only ever open amount or place; this is the door for the other checks (period_totals, date_span, vehicle_name) the CLI already supports through --key but this workflow never exposed.'
        type: string
        default: ''
      accept_keys:
        description: 'check/subject list, comma separated: answer directly (no referee, $0) through guardrails.py --accept. Requires note. Use only for a check the two-referee prompt cannot ask about (vehicle_name, period_totals, date_span) -- amount and place stay two-referee, per the owner ruling.'
        type: string
        default: ''
      reject_keys:
        description: 'check/subject list, comma separated: answer directly (no referee, $0) through guardrails.py --reject. Requires note.'
        type: string
        default: ''
      note:
        description: 'Required with accept_keys or reject_keys: why, in the reviewer''s own words'
        type: string
        default: ''
      reason:
        description: 'Why the session raised them (written to the ledger)'
        type: string
        default: ''
      dry_run:
        description: 'Ask the referees, write the specs, apply nothing'
        type: boolean
        default: true
      ceiling:
        description: 'Spend ceiling for this run, USD'
        type: string
        default: '0.50'

permissions:
  contents: write

env:
  # Which pot pays. A session-raised adjudication is not a scheduled job.
  TIT_RUN_KIND: discretionary

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db.
  group: talent-collect
  # It corrects the live site and then appends the revision that records it.
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    # A handful of rows, two short calls each, plus the source fetches.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # Forward work is funded first: a discretionary run asks the month's
      # switch before it can take any headroom. Degrade, never halt: a spent
      # month makes every referee call a BudgetStop, which is UNDECIDED and
      # applies nothing.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py --degrade

      - name: Answer directly (no referee), only for accept_keys/reject_keys
        id: direct
        if: ${{ inputs.accept_keys != '' || inputs.reject_keys != '' }}
        env:
          ACCEPT_KEYS: ${{ inputs.accept_keys }}
          REJECT_KEYS: ${{ inputs.reject_keys }}
          NOTE: ${{ inputs.note }}
          REASON: ${{ inputs.reason }}
        run: |
          set -o pipefail
          if [ -z "$NOTE" ]; then
            echo "::error::accept_keys/reject_keys need note: why, in the reviewer's own words"
            exit 1
          fi
          WHO="session ${REASON:-adjudicate-rows.yml}, $(date -u +%Y-%m-%d)"
          ARGS=(--note "$NOTE" --who "$WHO")
          IFS=',' read -ra A <<< "${ACCEPT_KEYS}"
          for k in "${A[@]}"; do k="${k// /}"; [ -n "$k" ] && ARGS+=(--accept "$k"); done
          IFS=',' read -ra J <<< "${REJECT_KEYS}"
          for k in "${J[@]}"; do k="${k// /}"; [ -n "$k" ] && ARGS+=(--reject "$k"); done
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            python guardrails.py "${ARGS[@]}"
          else
            echo "dry run: would run  python guardrails.py ${ARGS[*]}"
          fi

      - name: Adjudicate
        id: adjudicate
        if: ${{ inputs.rows != '' || inputs.place_rows != '' || inputs.keys != '' || inputs.from_spec != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          FROM_SPEC: ${{ inputs.from_spec }}
          ROWS: ${{ inputs.rows }}
          PLACE_ROWS: ${{ inputs.place_rows }}
          KEYS: ${{ inputs.keys }}
          REASON: ${{ inputs.reason }}
          CEILING: ${{ inputs.ceiling }}
        run: |
          set -o pipefail
          ARGS=(--health --ceiling "${CEILING:-0.50}" --reason "${REASON:-raised through adjudicate-rows.yml}")
          # --apply only when asked for by name; the input defaults to true, so
          # a dispatch that says nothing is a dry run.
          if [ "${{ inputs.dry_run }}" = "false" ]; then ARGS+=(--apply); fi
          IFS=',' read -ra S <<< "${FROM_SPEC}"
          for p in "${S[@]}"; do p="${p// /}"; [ -n "$p" ] && ARGS+=(--from-spec "$p"); done
          IFS=',' read -ra R <<< "${ROWS}"
          for h in "${R[@]}"; do h="${h// /}"; [ -n "$h" ] && ARGS+=(--row "$h"); done
          IFS=',' read -ra P <<< "${PLACE_ROWS}"
          for h in "${P[@]}"; do h="${h// /}"; [ -n "$h" ] && ARGS+=(--place-row "$h"); done
          IFS=',' read -ra K <<< "${KEYS}"
          for k in "${K[@]}"; do k="${k// /}"; [ -n "$k" ] && ARGS+=(--key "$k"); done
          # Exit 3 is "a human decides" (UNKNOWN or disagreement). The specs
          # are committed first, below, and the last step turns 3 into a red run.
          RC=0
          python adjudicate_guardrail.py "${ARGS[@]}" || RC=$?
          if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then exit "$RC"; fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Commit the database and the specs
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          # MERGE our ledger rows and revisions into the remote's database,
          # never copy our file over the top of it. merge_db.py carries a
          # reviewed publish_guardrails row and every new (content_hash,
          # revision) pair. See correct-funding-amount.yml.
          cp data/talent_intel.db "$RUNNER_TEMP/adjudicated.db"
          cp data/talent_intel_cache.db "$RUNNER_TEMP/adjudicated_cache.db"
          mkdir -p "$RUNNER_TEMP/specs"
          cp analysis/adjudications/*.json "$RUNNER_TEMP/specs/" 2>/dev/null || true
          LANDED=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/adjudicated.db" data/talent_intel.db
            mkdir -p analysis/adjudications
            cp "$RUNNER_TEMP"/specs/*.json analysis/adjudications/ 2>/dev/null || true
            git add data/talent_intel.db data/talent_intel_cache.db analysis/adjudications
            if git diff --staged --quiet; then
              echo "No data change."
              LANDED=1
              break
            fi
            git commit -q -m "data: two-referee adjudication of session-raised rows $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              LANDED=1
              break
            fi
            echo "Push rejected (attempt $attempt); merging onto the current main."
            sleep $((attempt * 5))
          done
          if [ "$LANDED" = "1" ]; then
            exit 0
          fi
          # The site was corrected BEFORE the database on purpose (an edit
          # pushes first), so a run that cannot push has fixed the live row and
          # lost only the record of having done so. Loud, because nothing else
          # would say so; the verdicts are in this run's log and nowhere else.
          echo "::error::could not push after 5 attempts"
          exit 1

      - name: A human decides
        if: ${{ steps.adjudicate.outputs.rc == '3' }}
        run: |
          echo "::error::At least one row is UNKNOWN or the referees disagreed."
          echo "::error::Nothing was applied for it. Read the spec under"
          echo "::error::analysis/adjudications/ and list it for the owner."
          exit 1
