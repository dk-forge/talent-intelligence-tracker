# One-time 2026 catch-up for world NEWS, via GDELT DOC 2.0.
#
# CORRECTED 2026-07-30: this line used to say "Google News RSS has no archive,
# so this is the only route to January-June 2026 press coverage". It is false —
# the RSS endpoint honours after:/before: back to at least 2016. See
# backfill-gnews-2026.yml. GDELT is still much cheaper per day of history and
# still the right walker for English-language world news; it is not the only
# one. Mirrors backfill-2026.yml (the SEC sweep) deliberately:
# same concurrency group, same commit-even-on-failure rule, spend reported
# either side.
#
# UNLIKE the SEC sweep, this one costs money per candidate rather than being
# bounded by a filing count, so it carries TWO ceilings: TIT_READTHROUGH_CAP
# for the process and --max-readthroughs for the run.
#
# IT RUNS IN BOUNDED SLICES AND REQUEUES ITSELF
# ---------------------------------------------
# This is the workflow that caused the incident of 2026-07-29. Dispatched for
# one month, it took the single `talent-collect` writer lock at 04:59 UTC, ran
# for 350 minutes, hit its own `timeout-minutes: 350` and was CANCELLED — which
# means its "Commit the database" step, guarded by `if: !cancelled()`, was
# SKIPPED. Roughly six hours of collection existed only on a runner that was
# then deleted, and every correction queued behind it waited the whole time.
#
# Priority ordering and starvation reporting both landed that day and neither
# could have helped: priority decides who goes next and cannot preempt a
# running job. So a run now does ONE SLICE — see backfill_gdelt_2026.SLICE_DAYS
# for the measurement behind its size — commits it, and appends a ticket for
# the next slice to data/writer_queue.json in the SAME commit. When the run
# ends, the group empties, drain-writers.yml fires on its `workflow_run:
# completed` trigger and dispatches the next slice, behind whatever short
# corrections arrived while this one ran.
#
# Progress lives in data/backfill_state.json, committed, so a run that dies
# loses at most its own slice and the next run works out where to resume by
# itself. Dispatch the WHOLE window you want (--start/--end); the cursor, not
# the input, decides where a run actually begins.
#
# It is slow by design. GDELT throttles erratically and the collector paces at
# 12 seconds a query, so a day-window is roughly 11 minutes of mostly waiting.
name: backfill-gdelt-2026

on:
  workflow_dispatch:
    inputs:
      historical_backfill:
        description: 'Fund PAID reads for a window before 2026-01-01 (deferred by default under the forward-first policy)'
        type: boolean
        required: false
        default: false
      start:
        description: 'Start date of the WHOLE backfill (YYYY-MM-DD)'
        required: true
      end:
        description: 'End date inclusive of the WHOLE backfill (YYYY-MM-DD)'
        required: true
      dry_run:
        description: 'Set to true to store nothing (still classifies, still costs). A dry run does NOT advance the cursor or requeue.'
        required: false
        default: 'false'
      fetch_only:
        description: 'Set to true to fetch and free-filter only — calls no model, spends nothing'
        required: false
        default: 'false'
      max_readthroughs:
        description: 'Hard stop on FULL classifications for the whole run. Blank uses the budget-derived default in backfill_gdelt_2026.py (35, ~$0.05 a slice).'
        required: false
        # LOWERED from 1200 on 2026-07-29, and the old value is why. 1200 reads
        # is ~$1.54 a slice; a year of 2026 history is 92 slices, so this input's
        # default alone authorised ~$142 against a ~$5/month product budget. A
        # ceiling only spend.py can stop is not a ceiling, it is a plan to be
        # interrupted. Blank now means "the derived default", which is computed
        # from MONTHLY_WALKER_BUDGET_USD at one slice a day, so the budget and
        # the ceiling cannot disagree. Type a number here for a session somebody
        # is watching; do not raise this default without raising the budget
        # constant beside it.
        default: ''

# One DB writer at a time, in the same group as the other backfills and enrich.
# Slicing changes how LONG this holds the lock; it does not change how many
# writers may hold it, and this group must not be split or weakened
# (tests/test_workflows.py::test_every_database_writer_shares_one_lock).
#
# NOTE, and it is not this workflow's to fix: the DAILY collector (collect.yml,
# collect-structured.yml, retract.yml) sits in a DIFFERENT group, `collect`, so
# a backfill and a daily run CAN overlap today. Both end with the same
# reset-to-origin-and-merge push loop, so the rows survive, but the two groups
# want merging into one.
concurrency:
  group: talent-collect
  cancel-in-progress: false

# Forward-first budget policy (spend.py, owner's decision 2026-08-10). Paid
# processing prioritizes 2026-01-01 onward, so a walk over an earlier window
# runs with PAID reads off unless the owner ticks historical_backfill on the
# dispatch. Declaring the window here is what lets `spend.py --degrade` tell
# forward work from historical work. Free paths are untouched: this walk still
# fetches, parses, validates and dedups, and its cursor is recorded so a funded
# run resumes on the first window it did not do. See docs/HANDOVER.md.
env:
  TIT_BACKFILL_START: ${{ inputs.start }}
  TIT_HISTORICAL_BACKFILL: ${{ inputs.historical_backfill && 'on' || '' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    # WHICH POT THIS SPENDS FROM (budget.py). Catch-up work: dispatched by
    # hand, never on a schedule, so it draws on the DISCRETIONARY pot and
    # cannot touch the committed one the scheduled collectors run on. In
    # August 2026 there was one pot, this family spent 88% of the month in
    # 2.5 days, and the collectors ran degraded for the nine days after.
    # Deleting this line does not save money; it moves the spend onto them.
    env:
      TIT_RUN_KIND: discretionary
    # A SLICE ceiling, not a backfill ceiling. It sits below
    # writer_queue.LONG_HOLD_MINUTES (120), the point at which the drainer
    # reports the queue as starved, so this workflow can no longer be the thing
    # that starves it. The script stops itself at SLICE_BUDGET_MINUTES, well
    # inside this, so the run ends CLEANLY and its commit step actually runs —
    # the one thing the 350-minute run never got to do.
    #
    # This ceiling is a lock-hold bound and does NOT move on measurement
    # (tests/test_workflows.py enforces it repo-wide). The 2026-08-03 slices
    # measured 58-66 min — 50 of script budget plus up to ~16 of fixed
    # checkout/install/commit overhead — which crowded this ceiling at 73%.
    # The fix is below: the SLICE got smaller (--budget-minutes 40), so the
    # worst case is ~40 + ~16 = ~56 min, 62% of 90, and a cancelled-at-the-
    # ceiling run (which loses its commit step) stays out of reach.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # DEGRADE, not enforce (2026-08-04). The 2026-07-28 note above approved
      # these backfills as report-only spend, estimated $7-12 in total. What
      # happened instead: 91 gnews-backfill dispatches on 2026-08-03 spent
      # ~$21.5 (MEASURED by balance delta), exhausted the month's allowance AND
      # the key's $20 credit cap, and every paid call has 402'd since
      # 2026-08-03 08:16Z. The scheduled collectors DO run `--degrade`, so the
      # discretionary job switched the production job off: collect.yml on
      # 08-04 deferred 351 google_news candidates unread.
      #
      # `--degrade` is not `--enforce` and does not halt this job. It exits 0
      # and sets TIT_PAID_READS=off only once the month's allowance is spent;
      # the backfill still fetches, still prefilters, still stores everything
      # it can close for free, and deferred candidates are left UNMARKED so a
      # later run reads them. The backfill has a cursor, so nothing is lost -
      # it resumes at the same slice. What it can no longer do is spend the
      # scheduled collectors' budget.
      - name: Spend before
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py --degrade

      - name: Backfill one slice
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # Raised for BACKFILL JOBS ONLY. The daily collector keeps its own
          # 60/run ceiling; a month held behind that would defer almost
          # everything. The run's own --max-readthroughs is the real bound, and
          # the key's hard cap at OpenRouter is the backstop.
          TIT_READTHROUGH_CAP: '5000'
        run: |
          python backfill_gdelt_2026.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            ${{ inputs.max_readthroughs != '' && format('--max-readthroughs {0}', inputs.max_readthroughs) || '' }} \
            --slice \
            --budget-minutes 40 \
            --emit-next "$RUNNER_TEMP/slice.json" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ inputs.fetch_only == 'true' && '--fetch-only' || '' }}

      - name: Spend after
        if: ${{ !cancelled() }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py || true

      # Same memory rule as the daily collector: a failed run that already
      # stored and published rows still holds the only local record of them.
      - name: Commit the slice, and queue the next one
        if: ${{ inputs.dry_run != 'true' && inputs.fetch_only != 'true' && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          # MERGE our rows into the remote's database, never copy our file over
          # the top of it — a copy destroys every row anyone else pushed while
          # this run was collecting. See merge_db.py.
          cp data/talent_intel.db "$RUNNER_TEMP/collected.db"
          cp data/spend_month.json "$RUNNER_TEMP/spend_month.json" 2>/dev/null || true
          # This slice's per-candidate gate verdicts, saved before the reset
          # discards them. A backfill pays for exactly the same gate calls the
          # daily run does, so its labels are worth exactly as much to the
          # classifier that is meant to replace that gate
          # (docs/PLAN-gate-to-five-dollars.md).
          rm -rf "$RUNNER_TEMP/gate_labels"
          cp -R data/gate_labels "$RUNNER_TEMP/gate_labels" 2>/dev/null || true
          RECORD_RC=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/collected.db" data/talent_intel.db
            cp "$RUNNER_TEMP/spend_month.json" data/spend_month.json 2>/dev/null || true
            # Appends only what main does not already hold, the same way
            # merge_db.py does. It cannot fail the step: labels are
            # bookkeeping and the rows are not.
            python merge_gate_labels.py "$RUNNER_TEMP/gate_labels" data/gate_labels || true
            # Applied AFTER the reset, on purpose and for the same reason the
            # database is merged rather than copied: both of these files have
            # other writers, and anything written before the reset is thrown
            # away by it. `record` merges this slice into whatever main holds
            # now, and --queue appends the next slice's ticket so the chain and
            # the data land in ONE commit. Its exit code is carried past the
            # push rather than allowed to abort the step, because a chain that
            # cannot advance must still not cost us the rows we collected.
            RECORD_RC=0
            if [ -f "$RUNNER_TEMP/slice.json" ]; then
              python backfill_slices.py record --from "$RUNNER_TEMP/slice.json" \
                --queue || RECORD_RC=$?
            fi
            git add data/talent_intel.db
            git add data/backfill_state.json data/writer_queue.json || true
            git add data/spend_month.json || true
            # `-A` and not a plain add: when a month closes the ledger gzips
            # the old shard and deletes the plain one, and a deletion that is
            # never staged is a file that comes back on the next reset.
            git add -A data/gate_labels || true
            if git diff --staged --quiet; then
              echo "Nothing to commit."
              break
            fi
            git commit -q -m "data: gdelt backfill slice ${{ inputs.start }}..${{ inputs.end }}"
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::could not push the database after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done
          if [ "$RECORD_RC" = "0" ]; then
            exit 0
          fi
          echo "::error::the slice was committed but the backfill chain did not"
          echo "::error::advance, so nothing was requeued. Read the record step"
          echo "::error::above, then: python backfill_slices.py status"
          exit 1
