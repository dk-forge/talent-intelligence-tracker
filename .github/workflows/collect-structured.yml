# The structured sources: SEC executive compensation, UK gender pay gap, BSE
# India leadership filings, EDINET Japan representative-director filings, DART
# Korea leadership filings, Companies House UK officer appointments, ARES
# Czechia office changes, Estonian business register appointments, and ATS
# job boards.
#
# These cost NOTHING to run. Every field they store is a column in a frame, a
# CSV or an API response, so the record is derived and no model is called. That
# is why there is no OPENROUTER_API_KEY, no spend guard and no spend report in
# this file: there is no spend to guard. `edinet_japan` and `opendart_korea` need
# a SECRET but still cost nothing — an API key is not spend, and neither
# collector downloads a document or calls a model.
#
# There is deliberately NO EDGAR_USER_AGENT mapping. That secret does not exist
# in this repo, and mapping a missing secret sets the environment variable to
# empty string, which SEC 403s — that is exactly how the first leadership
# dispatch went green having stored nothing. The code default carries the
# contact address.
#
# The daily schedule is for ats_boards and for nothing else. Those APIs have no
# history anywhere (the Wayback Machine holds zero snapshots of them) and no
# closed-on date, so a day that is not collected is gone permanently. The two
# SEC/UK ones are annual disclosures and only need a monthly look for late
# filers. bse_india sits between the two: India files leadership disclosures
# every business day, so monthly would be far too slow, but the API answers
# arbitrary date ranges so nothing is lost permanently and daily is wasteful.
# Weekly, with a 7-day window, means consecutive runs overlap by a day and a
# skipped week is recoverable with the days input.
#
# edinet_japan is weekly for the same reason and is cheaper still: EDINET's list
# endpoint takes ONE calendar day per call, so a 7-day window is 7 calls plus
# one code-list download. It is on Tuesday rather than Monday to keep the single
# database-writer lock uncontended; see the cron comment below.
#
# opendart_korea is weekly for the same reason and lands on WEDNESDAY, one day
# further along, for the same lock argument. A 7-day window is about 8 list
# pages (100 rows each, two detail types) plus one company.json per distinct
# employer, so roughly 30 requests against a documented 20,000/day quota.
# OpenDART answers arbitrary date ranges up to three months, so a missed week is
# back-filled by widening `days` and nothing is lost permanently.
#
# companies_house is weekly on THURSDAY and is the one slot that is long rather
# than cheap, because it POLLS rather than reads a list: there is no "recent
# appointments" endpoint anywhere in the Companies House REST API, so the only
# route is company-by-company, and the streaming API needs a different kind of
# key and a connection that never closes. It reads ONE QUARTER of the 9,230-
# company roster each week (a stable digest of the company number picks the
# slice, so nothing is committed and nothing can drift), which is ~2,600
# requests and ~23 minutes. Its window is 42 days, derived from that rotation
# plus a fortnight of slack, so a missed week is picked up on the slice's next
# visit rather than becoming a permanent hole; `ch_slice` replays one by hand.
#
# czechia_ares is weekly on FRIDAY and needs no key at all. It is the only
# collector here whose population comes from a CHANGE FEED: the register
# publishes which companies moved, and the run then reads those companies'
# employee band and, for the 1% at 250 staff or more, their register record. A
# 14-day window is ~475 requests and about two minutes, a quarter of the
# Ministry of Finance's stated 500-per-minute ceiling. The window CANNOT exceed
# 28 days — that is all the notification feed holds, and it answers a wider
# request with the batches it has rather than an error, so the collector
# refuses one instead of reporting a quiet month.
#
# spain_borme is the seventh weekly structured slot and it ships DORMANT: its
# SUNDAY cron below is commented out, and Sunday is the last day of the week no
# other database writer holds. It needs no key. Arming it is uncommenting one
# line, and the gate is the standing one — a human reads a REAL dry run first:
#
#     gh workflow run drain-writers.yml \
#       -f enqueue=collect-structured.yml \
#       -f inputs_json='{"source":"spain_borme","dry_run":"true"}' \
#       -f reason='first real BORME run'
#
# It is cheap in requests and slow in wall clock: a 7-day window is 7 summary
# calls plus about 210 province documents, and www.boe.es answers each in one to
# eight seconds, so a run is roughly 210 requests and 10 to 25 minutes — inside
# writer_queue.LONG_HOLD_MINUTES (120) with room to spare. BORME's archive is
# permanent and the summary API answers any past date, so a missed week is
# recovered by widening `days` up to spain_borme.MAX_DAYS and nothing is lost.
#
# estonia_ariregister is weekly on SATURDAY and needs no key either. It is
# unlike everything else here in shape: three static file downloads (45MB +
# 20MB + 18MB compressed) which stream out to about 1.5GB, so it is heavy in
# bytes and trivial in requests. Its window has no ceiling — every file is a
# fresh full snapshot — but widening it recovers less than it looks like,
# because the file lists CURRENT office-holders only and an appointment that
# has already ended is not in it at all.
name: collect-structured

on:
  schedule:
    - cron: '0 9 * * *'      # every day: ATS boards, the perishable one
    - cron: '30 9 5 * *'     # 5th of the month: SEC exec comp, for late proxies
    - cron: '30 10 6 * *'    # 6th of the month: UK gender pay gap
    - cron: '0 4 * * 1'      # Mondays: BSE India leadership filings
    # TUESDAY, not Monday, and the day matters. Monday already carries the BSE
    # slot at 04:00, the link-hygiene ticket at 05:30 and the weekly digest at
    # 13:00, and every database writer shares the single `talent-collect` lock
    # in which GitHub keeps exactly ONE pending run — a second scheduled writer
    # queued behind the first can evict a waiting run, which ends `cancelled`
    # with no jobs and no logs. Moving a weekly job one day sideways costs
    # nothing and removes that contention entirely.
    - cron: '0 4 * * 2'      # Tuesdays: EDINET Japan representative-director filings
    # WEDNESDAY, one day further along the same argument as the Tuesday slot.
    - cron: '0 4 * * 3'      # Wednesdays: DART Korea leadership filings
    # THURSDAY, same argument again. This is the longest of the weekly slots:
    # one run polls a quarter of the 9,230-company UK roster, which is ~2,600
    # requests and ~23 minutes at the 600-per-5-minutes limit. That is why the
    # roster is sliced rather than swept whole — a whole sweep is ~92 minutes,
    # and writer_queue.LONG_HOLD_MINUTES is 120.
    - cron: '0 4 * * 4'      # Thursdays: companies_house officer appointments
    # FRIDAY, same argument again. Cheap: the run is ~475 requests for a
    # 14-day window (24 to walk the change feed, ~100 to band 10,000 changed
    # companies 100 at a time, ~110 register records) and about two minutes of
    # wall clock at a quarter of the Ministry of Finance's stated ceiling of
    # 500 queries a minute.
    - cron: '0 4 * * 5'      # Fridays: ARES Czechia office changes
    # SATURDAY, same argument again, and this one is heavy in BYTES rather than
    # in requests: three published files, 45MB + 20MB + 18MB compressed,
    # expanding to about 1.5GB that is streamed rather than held. Three HTTP
    # requests in total and roughly two minutes of parsing.
    - cron: '0 4 * * 6'      # Saturdays: Estonian business register appointments
    # SUNDAY, the last day of the week no other database writer holds. COMMENTED
    # OUT ON PURPOSE: spain_borme ships dormant until a human has read a real
    # dry run, which is the standing pattern in this repo and the same gate the
    # tripwire sits behind. Arming it is uncommenting the next line and nothing
    # else — the `Pick the source` case below already maps this expression.
    # - cron: '0 4 * * 0'      # Sundays: BORME Spain consejero delegado acts
  workflow_dispatch:
    inputs:
      source:
        description: 'Collector to run'
        type: choice
        options: [ats_boards, sec_execcomp, uk_paygap, bse_india, edinet_japan, opendart_korea, companies_house, czechia_ares, estonia_ariregister, spain_borme]
        default: ats_boards
      years:
        description: 'Backfill years, comma separated. Exec comp: 2022..2025. Pay gap: 2017..2025. Blank = the last complete year.'
        required: false
        default: ''
      min_size:
        description: 'Pay gap only. Employer size floor: 250, 500, 1000, 5000 or 20000.'
        required: false
        default: '5000'
      days:
        description: 'BSE India, EDINET Japan, DART Korea, Companies House, ARES Czechia, Ariregister Estonia and BORME Spain. How many days back to read. Blank = each collector default (7; 42 for Companies House, derived from its rotation; 14 for Czechia; 21 for Estonia; 7 for Spain). CEILINGS, and they are not the same: BSE 32 (undocumented, measured 2026-07-30 — it refuses wider inside an HTTP 200), DART 90 (three-month API limit), EDINET 366, ARES 28 (all its notification feed holds, and it answers a wider request with the batches it has rather than an error), Companies House, Estonia and Spain none — Spain is capped at spain_borme.MAX_DAYS (60) only to keep one run inside the writer lock. A gap SHORTER than the ceiling is closed by widening this; anything longer is backfill-structured-2026.yml.'
        required: false
        default: ''
      ch_slice:
        description: 'Companies House only. Which roster slice to poll, 0-3. Blank = this ISO week. Set it to replay a slice a missed run skipped.'
        required: false
        default: ''
      ch_min_size:
        description: 'Companies House only. Employer size floor: 250, 500, 1000, 5000 or 20000. Blank = 250, which IS the statutory materiality floor; raising it narrows the roster and is not a cost saving.'
        required: false
        default: ''
      dry_run:
        description: 'Show what would be stored, write nothing'
        type: boolean
        default: false

# The same group the daily news collector uses. Two jobs writing the SQLite
# file at once would race on the commit, and the reset-and-replace below is
# only safe while this is the sole writer.
concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # A dispatch says which collector to run. A cron cannot, so the schedule
      # expression itself picks one.
      - name: Pick the source
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '30 9 5 * *')  scheduled=sec_execcomp ;;
            '30 10 6 * *') scheduled=uk_paygap ;;
            '0 4 * * 1')   scheduled=bse_india ;;
            '0 4 * * 2')   scheduled=edinet_japan ;;
            '0 4 * * 3')   scheduled=opendart_korea ;;
            '0 4 * * 4')   scheduled=companies_house ;;
            '0 4 * * 5')   scheduled=czechia_ares ;;
            '0 4 * * 6')   scheduled=estonia_ariregister ;;
            '0 4 * * 0')   scheduled=spain_borme ;;
            *)             scheduled=ats_boards ;;
          esac
          if [ -z "${{ inputs.source }}" ]; then
            echo "value=$scheduled" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          TIT_EXECCOMP_YEARS: ${{ inputs.years }}
          TIT_PAYGAP_YEARS: ${{ inputs.years }}
          TIT_PAYGAP_MIN_SIZE: ${{ inputs.min_size || '5000' }}
          TIT_BSE_DAYS: ${{ inputs.days }}
          TIT_EDINET_DAYS: ${{ inputs.days }}
          # EDINET's v2 API requires a subscription key on every request. This
          # secret DOES exist (set 2026-07-30), which is what separates it from
          # the EDGAR_USER_AGENT case in the header comment above: mapping a
          # secret that does not exist sets the variable to empty string, and
          # EDINET answers an empty key with HTTP 200 carrying
          # {"StatusCode": 401} in the body — a silent zero. The collector
          # refuses an empty key at its first line for exactly that reason.
          EDINET_API_KEY_JP: ${{ secrets.EDINET_API_KEY_JP }}
          TIT_DART_DAYS: ${{ inputs.days }}
          # OpenDART requires crtfc_key on every request. This secret DOES
          # exist (set 2026-07-30). The empty-secret failure mode here is
          # different from EDINET's and worse: a request with no crtfc_key at
          # all answers HTTP 302 and an HTML error page, while a syntactically
          # valid but unregistered key answers HTTP 200 with
          # {"status":"010"}. Verified live and keyless on 2026-07-29. So
          # neither the status code nor "it parsed as JSON" means success, and
          # the collector refuses an empty or malformed key before it spends a
          # request.
          OPENDART_API_KEY_KR: ${{ secrets.OPENDART_API_KEY_KR }}
          TIT_CH_DAYS: ${{ inputs.days }}
          TIT_CH_SLICE: ${{ inputs.ch_slice }}
          TIT_CH_MIN_SIZE: ${{ inputs.ch_min_size }}
          # Companies House needs a key on every path — the REST API, the
          # streaming API and even /robots.txt answer 401 unauthenticated. This
          # secret DOES exist (set 2026-07-30) and it is a REST key. The
          # empty-secret failure mode is the clean one for once: an empty
          # Authorization header answers 401 with
          # {"error":"Empty Authorization header"}, so there is no silent zero
          # to fall into. The collector still refuses an empty key before it
          # spends a request, and names the trap that IS silent-shaped: a
          # STREAMING key is a separate registration and is not interchangeable
          # with this one, so a perfectly valid-looking key can 401 forever.
          COMPANIES_HOUSE_API_KEY_UK: ${{ secrets.COMPANIES_HOUSE_API_KEY_UK }}
          # ARES and Ariregister need NO SECRET AT ALL, which is why neither
          # appears below with one. Both are keyless open data: ares.gov.cz
          # answers every path used here unauthenticated, and the Estonian
          # files are static downloads. There is deliberately no empty-secret
          # mapping for either — mapping a secret that does not exist sets the
          # variable to empty string, which is how the first leadership
          # dispatch went green having stored nothing.
          TIT_ARES_DAYS: ${{ inputs.days }}
          TIT_EE_DAYS: ${{ inputs.days }}
          # BORME is keyless too, for the same reason and with the same
          # deliberate absence of an empty-secret mapping. www.boe.es serves the
          # summary API and the bulletin unauthenticated.
          TIT_BORME_DAYS: ${{ inputs.days }}
        run: |
          python run_collect.py \
            --source "${{ steps.pick.outputs.value }}" \
            ${{ inputs.dry_run && '--dry-run' || '--publish' }}

      - name: Status
        if: ${{ !inputs.dry_run }}
        run: python ops_status.py || true

      # Same memory rule as the news collector, and it matters more here: the
      # ATS state file IS the archive. These boards publish no history, so a
      # run whose state file never lands has permanently lost that day.
      #
      # `!cancelled()` and not plain success: a run that failed after storing
      # and publishing rows still holds the only local record of them.
      - name: Commit the database
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db data/ats_board_state.json 2>/dev/null \
            || git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          # The database MERGES; the ATS state file is a whole-file snapshot with
          # no row identity, so it stays last-writer-wins. Copying the database
          # the same way is exactly how the four runs on 2026-07-28 21:29-21:45
          # (ats_boards, sec_execcomp x2, uk_paygap) had all 8,751 of their rows
          # destroyed by the backfill that pushed at 21:53. See merge_db.py.
          mkdir -p "$RUNNER_TEMP/keep"
          cp data/talent_intel.db "$RUNNER_TEMP/keep/talent_intel.db"
          if [ -f data/ats_board_state.json ]; then
            cp data/ats_board_state.json "$RUNNER_TEMP/keep/ats_board_state.json"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/keep/talent_intel.db" data/talent_intel.db
            if [ -f "$RUNNER_TEMP/keep/ats_board_state.json" ]; then
              cp "$RUNNER_TEMP/keep/ats_board_state.json" data/ats_board_state.json
            fi
            git add data/talent_intel.db data/ats_board_state.json 2>/dev/null \
              || git add data/talent_intel.db
            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi
            git commit -q -m "data: ${{ steps.pick.outputs.value }} $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts. This run's records \
          exist only on the runner and are lost."
          exit 1
