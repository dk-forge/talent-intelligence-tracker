# The structured sources: SEC executive compensation, UK gender pay gap, BSE
# India leadership filings, and ATS job boards.
#
# These cost NOTHING to run. Every field they store is a column in a frame, a
# CSV or an API response, so the record is derived and no model is called. That
# is why there is no OPENROUTER_API_KEY, no spend guard and no spend report in
# this file: there is no spend to guard.
#
# There is deliberately NO EDGAR_USER_AGENT mapping. That secret does not exist
# in this repo, and mapping a missing secret sets the environment variable to
# empty string, which SEC 403s — that is exactly how the first leadership
# dispatch went green having stored nothing. The code default carries the
# contact address.
#
# The daily schedule is for ats_boards and for nothing else. Those APIs have no
# history anywhere (the Wayback Machine holds zero snapshots of them) and no
# closed-on date, so a day that is not collected is gone permanently. The two
# SEC/UK ones are annual disclosures and only need a monthly look for late
# filers. bse_india sits between the two: India files leadership disclosures
# every business day, so monthly would be far too slow, but the API answers
# arbitrary date ranges so nothing is lost permanently and daily is wasteful.
# Weekly, with a 7-day window, means consecutive runs overlap by a day and a
# skipped week is recoverable with the days input.
name: collect-structured

on:
  schedule:
    - cron: '0 9 * * *'      # every day: ATS boards, the perishable one
    - cron: '30 9 5 * *'     # 5th of the month: SEC exec comp, for late proxies
    - cron: '30 10 6 * *'    # 6th of the month: UK gender pay gap
    - cron: '0 4 * * 1'      # Mondays: BSE India leadership filings
  workflow_dispatch:
    inputs:
      source:
        description: 'Collector to run'
        type: choice
        options: [ats_boards, sec_execcomp, uk_paygap, bse_india]
        default: ats_boards
      years:
        description: 'Backfill years, comma separated. Exec comp: 2022..2025. Pay gap: 2017..2025. Blank = the last complete year.'
        required: false
        default: ''
      min_size:
        description: 'Pay gap only. Employer size floor: 250, 500, 1000, 5000 or 20000.'
        required: false
        default: '5000'
      days:
        description: 'BSE India only. How many days back to read. Blank = 7. A gap is back-filled by widening this.'
        required: false
        default: ''
      dry_run:
        description: 'Show what would be stored, write nothing'
        type: boolean
        default: false

# The same group the daily news collector uses. Two jobs writing the SQLite
# file at once would race on the commit, and the reset-and-replace below is
# only safe while this is the sole writer.
concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # A dispatch says which collector to run. A cron cannot, so the schedule
      # expression itself picks one.
      - name: Pick the source
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '30 9 5 * *')  scheduled=sec_execcomp ;;
            '30 10 6 * *') scheduled=uk_paygap ;;
            '0 4 * * 1')   scheduled=bse_india ;;
            *)             scheduled=ats_boards ;;
          esac
          if [ -z "${{ inputs.source }}" ]; then
            echo "value=$scheduled" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          TIT_EXECCOMP_YEARS: ${{ inputs.years }}
          TIT_PAYGAP_YEARS: ${{ inputs.years }}
          TIT_PAYGAP_MIN_SIZE: ${{ inputs.min_size || '5000' }}
          TIT_BSE_DAYS: ${{ inputs.days }}
        run: |
          python run_collect.py \
            --source "${{ steps.pick.outputs.value }}" \
            ${{ inputs.dry_run && '--dry-run' || '--publish' }}

      - name: Status
        if: ${{ !inputs.dry_run }}
        run: python ops_status.py || true

      # Same memory rule as the news collector, and it matters more here: the
      # ATS state file IS the archive. These boards publish no history, so a
      # run whose state file never lands has permanently lost that day.
      #
      # `!cancelled()` and not plain success: a run that failed after storing
      # and publishing rows still holds the only local record of them.
      - name: Commit the database
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db data/ats_board_state.json 2>/dev/null \
            || git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          # The database MERGES; the ATS state file is a whole-file snapshot with
          # no row identity, so it stays last-writer-wins. Copying the database
          # the same way is exactly how the four runs on 2026-07-28 21:29-21:45
          # (ats_boards, sec_execcomp x2, uk_paygap) had all 8,751 of their rows
          # destroyed by the backfill that pushed at 21:53. See merge_db.py.
          mkdir -p "$RUNNER_TEMP/keep"
          cp data/talent_intel.db "$RUNNER_TEMP/keep/talent_intel.db"
          if [ -f data/ats_board_state.json ]; then
            cp data/ats_board_state.json "$RUNNER_TEMP/keep/ats_board_state.json"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/keep/talent_intel.db" data/talent_intel.db
            if [ -f "$RUNNER_TEMP/keep/ats_board_state.json" ]; then
              cp "$RUNNER_TEMP/keep/ats_board_state.json" data/ats_board_state.json
            fi
            git add data/talent_intel.db data/ats_board_state.json 2>/dev/null \
              || git add data/talent_intel.db
            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi
            git commit -q -m "data: ${{ steps.pick.outputs.value }} $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts. This run's records \
          exist only on the runner and are lost."
          exit 1
