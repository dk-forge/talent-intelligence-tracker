# Historical walker for the publisher catalogue, in bounded ROSTER slices.
#
# WHAT IT IS FOR
# --------------
# data/recall_rejection_audit.json: of 81 gold-set misses, ZERO were fetched and
# rejected, and 51 are `outside_our_history` — published 2026-07-01..07-17,
# before the news collectors first ran. An RSS feed is a window and not an
# archive, so `national_press` cannot reach any of it at any price. A
# publisher's XML sitemap can, and collectors/press_archive.py reads exactly
# that, for the same catalogue and the same publishers.
#
# THE CURSOR WALKS PUBLISHERS, NOT DAYS, AND THAT IS NOT A PREFERENCE
# -------------------------------------------------------------------
# A sitemap costs the same fetch whether the window is one day or six months:
# the date is a FILTER over rows the document returned anyway. A date cursor
# would therefore "finish" 2026-01-01..04 having downloaded every publisher's
# whole 2026 and thrown 99% of it away, then download it all again for the next
# four days. So the unit is `slices` — an index into a deterministic partition
# of the roster — exactly as backfill_slices.UNITS documents for
# companies_house. The consequence is a good one: WIDENING THE WINDOW IS FREE.
#
# WHAT IT COSTS, AND WHAT WAS REFUSED
# -----------------------------------
# Measured with the shipping code on 82 catalogue publishers against 2026-03 (a
# month no 48-hour news sitemap and no section-page lastmod can fake): 34 of 82
# reach it, median 163 URLs each, 3.08% past the free prefilter on the slug and
# ~5.6% on the real title and teaser. Scaled to 653 feeds that is ~3,500
# candidates per month of history, ~$0.79 to gate in full, ~$9.42 for a year —
# MORE than GDELT's whole year ($4.51) and the Google News walker's ($3.02). So
# a full-depth sweep is REFUSED. The gate is rationed instead: 75 candidates a
# slice, DERIVED from MONTHLY_WALKER_BUDGET_USD, ranked by country need, and
# everything past the cut left UNMARKED so a later pass reads different rows.
# `--plan-cost` prints all of it, including what it would actually have caught
# (4 of the 51 misses, about 8%).
#
# IT RUNS IN BOUNDED SLICES AND REQUEUES ITSELF
# ---------------------------------------------
# Same shape as backfill-gdelt-2026.yml and for the same reason: that workflow
# took the single `talent-collect` writer lock for 350 minutes on 2026-07-29,
# hit its own timeout, was CANCELLED, and had its commit step skipped by
# `if: !cancelled()`. A run here does ONE SLICE, commits it, and appends a
# ticket for the next slice to data/writer_queue.json in the SAME commit.
#
# NOT ARMED, and there are two reasons rather than one. It costs money, which is
# the owner's decision; and it writes the database, so a `schedule:` here would
# enter the single talent-collect group uncoordinated and either evict the
# pending run or become an unreplayable orphan. tests/test_backfill_pace.py
# fails if a cron appears.
name: backfill-press-2026

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First day of the HISTORICAL WINDOW (YYYY-MM-DD). Not a cursor — the cursor walks publishers, and widening this is free.'
        required: true
      end:
        description: 'Last day of the historical window, inclusive (YYYY-MM-DD).'
        required: true
      dry_run:
        description: 'Set to true to store nothing (still classifies, still costs). A dry run does NOT advance the cursor or requeue.'
        required: false
        default: 'false'
      fetch_only:
        description: 'Set to true to enumerate, read heads and free-filter only — calls no model, writes nothing, spends nothing.'
        required: false
        default: 'false'
      ration:
        description: 'Candidates GATED per slice. Blank uses the budget-derived default in backfill_press_2026.py (75, ~$0.017 a slice). Raising this raises the bill in proportion.'
        required: false
        default: ''

# One DB writer at a time, in the same group as every other writer. Slicing
# changes how LONG this holds the lock; it does not change how many writers may
# hold it, and this group must not be split or weakened
# (tests/test_workflows.py::test_every_database_writer_shares_one_lock).
concurrency:
  group: talent-collect
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # A SLICE ceiling, not a backfill ceiling. Below
    # writer_queue.LONG_HOLD_MINUTES (120), so this workflow cannot be the thing
    # that starves the queue. The script stops itself at SLICE_BUDGET_MINUTES,
    # well inside this, so the run ends CLEANLY and its commit step actually
    # runs — the one thing the 350-minute run never got to do.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Spend before
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py || true

      - name: Walk one roster slice
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # Raised for BACKFILL JOBS ONLY, so the process ceiling never binds
          # before the run's own ration does. The ration is the real bound and
          # the key's hard cap at OpenRouter is the backstop.
          TIT_READTHROUGH_CAP: '5000'
        run: |
          python backfill_press_2026.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            ${{ inputs.ration != '' && format('--ration {0}', inputs.ration) || '' }} \
            --slice \
            --emit-next "$RUNNER_TEMP/slice.json" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ inputs.fetch_only == 'true' && '--fetch-only' || '' }}

      - name: Spend after
        if: ${{ !cancelled() }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py || true

      # Same memory rule as the daily collector: a failed run that already
      # stored and published rows still holds the only local record of them.
      - name: Commit the slice, and queue the next one
        if: ${{ inputs.dry_run != 'true' && inputs.fetch_only != 'true' && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          # MERGE our rows into the remote's database, never copy our file over
          # the top of it — a copy destroys every row anyone else pushed while
          # this run was collecting. See merge_db.py.
          cp data/talent_intel.db "$RUNNER_TEMP/collected.db"
          cp data/spend_month.json "$RUNNER_TEMP/spend_month.json" 2>/dev/null || true
          RECORD_RC=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/collected.db" data/talent_intel.db
            cp "$RUNNER_TEMP/spend_month.json" data/spend_month.json 2>/dev/null || true
            # Applied AFTER the reset, for the same reason the database is
            # merged rather than copied: both files have other writers and
            # anything written before the reset is thrown away by it. `record`
            # merges this slice into whatever main holds now, and --queue
            # appends the next slice's ticket so the chain and the data land in
            # ONE commit. Its exit code is carried past the push rather than
            # allowed to abort the step, because a chain that cannot advance
            # must still not cost us the rows we collected.
            RECORD_RC=0
            if [ -f "$RUNNER_TEMP/slice.json" ]; then
              python backfill_slices.py record --from "$RUNNER_TEMP/slice.json" \
                --queue || RECORD_RC=$?
            fi
            git add data/talent_intel.db
            git add data/backfill_state.json data/writer_queue.json || true
            git add data/press_archive_health.json || true
            git add data/spend_month.json || true
            if git diff --staged --quiet; then
              echo "Nothing to commit."
              break
            fi
            git commit -q -m "data: press archive walk, window ${{ inputs.start }}..${{ inputs.end }}"
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::could not push the database after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done
          if [ "$RECORD_RC" = "0" ]; then
            exit 0
          fi
          echo "::error::the slice was committed but the backfill chain did not"
          echo "::error::advance, so nothing was requeued. Read the record step"
          echo "::error::above, then: python backfill_slices.py status"
          exit 1
