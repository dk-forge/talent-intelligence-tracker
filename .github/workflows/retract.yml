name: retract

# Withdraw a published record. Nothing is deleted: the row is marked
# not-current with a reason, so the corrections log can show what was published
# and when it was withdrawn.

on:
  workflow_dispatch:
    inputs:
      signal_id:
        description: 'signal_id to retract (leave blank to use bare_domains)'
        type: string
        default: ''
      reason:
        description: 'Why it is being withdrawn (shown in the corrections log)'
        type: string
        required: true
      bare_domains:
        description: 'Retract every row whose source link is an outlet homepage'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  # Stated rather than left to the platform default. This workflow WITHDRAWS
  # published rows, so a run killed halfway is the worst outcome of any writer
  # here, and a data-safety property should not rest on a default that a future
  # platform change could flip underneath us.
  cancel-in-progress: false

jobs:
  retract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Retract
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          if [ "${{ inputs.bare_domains }}" = "true" ]; then
            python retract.py --bare-domains "${{ inputs.reason }}"
          else
            python retract.py "${{ inputs.signal_id }}" "${{ inputs.reason }}"
          fi

      # A single push attempt LOSES THE RECORD OF A WITHDRAWAL that has already
      # been applied to WordPress. That happened on 2026-07-29 (run
      # 30481782149): retract.py withdrew the rows live, then this step's plain
      # `git push` was rejected because another job had moved main in the
      # meantime, and the run went red with the site and the repo disagreeing.
      #
      # collect.yml has solved exactly this since the first armed run, with a
      # replay loop, and drain-writers.yml with a rebase-and-retry loop; the fix
      # is now carried across (see below). It matters MORE here than in either
      # of those: a lost collect commit re-collects next run and a lost queue
      # commit is re-derived next tick, but a lost retract commit leaves a row
      # withdrawn on the site and still present in the database, so the next run
      # reads it as live.
      #
      # `!cancelled()` and not plain success, for the same reason collect.yml
      # uses it: a run that FAILED after withdrawing rows still holds the only
      # local record that the withdrawal happened.
      - name: Commit the database
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          git commit -q -m "data: retract $(date -u +%Y-%m-%dT%H:%MZ)"

          # Rebase, NOT the reset-and-copy loop the collectors use, and NOT
          # merge_db.py. Retraction flips `is_current` on an EXISTING row
          # rather than appending a new (content_hash, revision), so:
          #   - merge_db.py has no new revision to carry and would skip every
          #     withdrawal, turning a loud rerun into a silent no-op;
          #   - reset-hard-then-copy-our-file-back would overwrite any rows
          #     another writer landed while this ran, which is the exact
          #     silent data loss the correction workflows' comments record.
          # correct-form-d.yml and correct-layoff-scope.yml carry the same
          # reasoning; this is consistent with them.
          #
          # FIVE attempts, rebasing onto current main before each one, which is
          # the shape drain-writers.yml uses. A SINGLE attempt is what failed on
          # 2026-07-29 (run 30481782149): the rebase ran, another job pushed in
          # the gap between it and `git push`, and the push was rejected with
          # the withdrawal already applied to WordPress. The window is a few
          # hundred milliseconds wide and the drainer commits the queue file
          # every fifteen minutes, so losing that race is routine rather than
          # exotic — and it does not conflict, because the drainer touches
          # data/writer_queue.json and not the database. There is nothing to
          # decide between attempt one and attempt two except that main moved:
          # exactly what a retry is for.
          for attempt in 1 2 3 4 5; do
            # Before every push, not once before the loop: the point is to be
            # on top of whatever main is NOW, and a rejected push means it
            # moved again since the last time we looked.
            if ! git pull --rebase --autostash origin main; then
              # A binary conflict is not a lost race and will not clear by
              # waiting — another writer changed the same file, and git cannot
              # merge two SQLite files. Abort so the runner is not left
              # mid-rebase, and go red on the spot rather than spending four
              # more attempts arriving at the same place. This is the same
              # honest outcome correct-form-d.yml chooses.
              git rebase --abort || true
              echo "::error::retract: data/talent_intel.db conflicts with main and"
              echo "::error::cannot be rebased, so this withdrawal was NOT committed."
              echo "::error::The rows are already withdrawn on the site (see the step"
              echo "::error::above), so the database still reads them as live until"
              echo "::error::this is re-run. Re-queue it — do NOT copy a database file"
              echo "::error::over main, which would destroy every row pushed since:"
              echo "::error::  gh workflow run drain-writers.yml -f enqueue=retract.yml \\"
              echo "::error::       -f inputs_json='{\"signal_id\":\"...\",\"reason\":\"...\"}' \\"
              echo "::error::       -f reason='retract commit lost to a conflict'"
              exit 1
            fi
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — main moved again; rebasing."
            sleep $((attempt * 3))
          done

          # Loud, and specific about what is half-applied. The rows are gone
          # from the site and still present here, which is the one state this
          # workflow must never leave behind quietly.
          echo "::error::retract: could not push the withdrawal after 5 attempts."
          echo "::error::The rows are already withdrawn on the site but the database"
          echo "::error::commit did not land, so the two disagree until this is"
          echo "::error::re-run. Re-queue it:"
          echo "::error::  gh workflow run drain-writers.yml -f enqueue=retract.yml \\"
          echo "::error::       -f inputs_json='{\"signal_id\":\"...\",\"reason\":\"...\"}' \\"
          echo "::error::       -f reason='retract commit lost to a racing push'"
          exit 1
