name: retract

# Withdraw published records. Nothing is deleted: the row is marked
# not-current with a reason, so the corrections log can show what was published
# and when it was withdrawn.
#
# ONE RUN WITHDRAWS A LIST. `signal_id` takes a comma-separated list, and it
# must, because the alternative does not work: the concurrency group below
# keeps ONE pending run, so dispatching a 27-row correction as 27 runs silently
# drops most of them, and running them one at a time would be 27 rebase-and-push
# commits against a 72MB binary database — 27 chances at the binary conflict the
# push step's own comment says goes red. The list rides the EXISTING string
# input, so this adds no new `${{ }}` surface at all.
#
# One reason applies to the whole list. A correction is one editorial act.

on:
  workflow_dispatch:
    inputs:
      signal_id:
        description: 'signal_id, or a comma-separated list (blank to use bare_domains)'
        type: string
        default: ''
      reason:
        description: 'Why they are being withdrawn (one reason, shown in the corrections log)'
        type: string
        required: true
      bare_domains:
        description: 'Retract every row whose source link is an outlet homepage'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  # Stated rather than left to the platform default. This workflow WITHDRAWS
  # published rows, so a run killed halfway is the worst outcome of any writer
  # here, and a data-safety property should not rest on a default that a future
  # platform change could flip underneath us.
  cancel-in-progress: false

jobs:
  retract:
    runs-on: ubuntu-latest
    # RE-DERIVED 2026-08-13 for lists. The 15 here was measured over runs that
    # withdrew a handful of rows (median 0.3 min, max 0.5 over 13 runs); a
    # 27-row list is a case nothing had timed, so the arithmetic, stated:
    #
    #   nominal   fixed overhead (checkout + hashed pip + the 72MB commit and
    #             push) is what the 0.5 min max is nearly all of; the rows add
    #             one POST each, ~1s, so 27 rows nominal is about 1 minute.
    #   worst     a row that exhausts RETRY_PAUSES costs 5 attempts x 45s
    #             timeout + 49s of pauses ~= 4.6 min. Twenty-seven of those is
    #             ~2 hours, which no timeout-minutes should ever cover.
    #
    # So the SCRIPT bounds itself rather than being killed here: retract.py's
    # RUN_BUDGET_SECONDS (20 min) stops starting rows past the budget, reports
    # the rest by name as "not attempted", and exits non-zero — which keeps the
    # commit step below running, and that step holds the only local record of
    # withdrawals the site has already applied. Being killed by the platform
    # mid-list is the outcome that loses that record.
    #
    # Ceiling = budget (20) + one row's full ladder (4.6) + overhead (0.5)
    # ~= 25.1 min. 30 is that with headroom, so the self-imposed budget always
    # wins the race against the platform's clock. Raise BOTH together or not at
    # all: a timeout under the budget hands the kill back to GitHub.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # The reason arrives through the ENVIRONMENT, never through `${{ }}`.
      # A `${{ }}` inside a run block is pasted in as text before the shell
      # sees it, so the shell then expands what it finds. On 2026-08-04 the
      # CXMT withdrawal was sent with the reason "... an $8.6bn Shanghai STAR
      # Market IPO ..." and `$8` expanded to the (empty) eighth positional
      # parameter: WordPress and the database both recorded "an .6bn", losing
      # the very figure the retraction exists to correct. Nothing failed and
      # the run was green. A reason carrying a backtick or `$(...)` would have
      # been executed rather than merely eaten.
      #
      # drain-writers.yml has passed dispatch inputs through the environment
      # since it was written, and says why in its own comment; the lesson was
      # never carried across to the workflow it dispatches.
      #
      # The LIST rides the same env var, quoted the same way. A comma-separated
      # list needed no new input and gets no new interpolation: `"$TIT_SIGNAL_ID"`
      # reaches python as one argument whatever is in it, and retract.py splits
      # it — the shell never sees the separators. Do not "improve" this into a
      # for-loop over the ids in bash; that puts every id back through word
      # splitting, and the retry, the per-row report and the single commit all
      # live on the python side anyway.
      - name: Retract
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          TIT_SIGNAL_ID: ${{ inputs.signal_id }}
          TIT_REASON: ${{ inputs.reason }}
          TIT_BARE: ${{ inputs.bare_domains }}
        run: |
          if [ "$TIT_BARE" = "true" ]; then
            python retract.py --bare-domains "$TIT_REASON"
          else
            python retract.py "$TIT_SIGNAL_ID" "$TIT_REASON"
          fi

      # A single push attempt LOSES THE RECORD OF A WITHDRAWAL that has already
      # been applied to WordPress. That happened on 2026-07-29 (run
      # 30481782149): retract.py withdrew the rows live, then this step's plain
      # `git push` was rejected because another job had moved main in the
      # meantime, and the run went red with the site and the repo disagreeing.
      #
      # collect.yml has solved exactly this since the first armed run, with a
      # replay loop; the fix was never carried across to the other writers. It
      # matters MORE here than there: a lost collect commit re-collects next
      # run, but a lost retract commit leaves a row withdrawn on the site and
      # still present in the database, so the next run reads it as live.
      #
      # `!cancelled()` and not plain success, for the same reason collect.yml
      # uses it: a run that FAILED after withdrawing rows still holds the only
      # local record that the withdrawal happened.
      - name: Commit the database
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          git commit -q -m "data: retract $(date -u +%Y-%m-%dT%H:%MZ)"

          # Rebase, NOT the reset-and-copy loop the collectors use, and NOT
          # merge_db.py. Retraction flips `is_current` on an EXISTING row
          # rather than appending a new (content_hash, revision), so:
          #   - merge_db.py has no new revision to carry and would skip every
          #     withdrawal, turning a loud rerun into a silent no-op;
          #   - reset-hard-then-copy-our-file-back would overwrite any rows
          #     another writer landed while this ran, which is the exact
          #     silent data loss the correction workflows' comments record.
          # correct-form-d.yml and correct-layoff-scope.yml carry the same
          # reasoning; this is now consistent with them.
          #
          # On a binary conflict the rebase stops and the run goes red. That is
          # the honest outcome: re-queue it. Losing a withdrawal silently is
          # far worse, because the row stays live on the site while the
          # database believes it is gone.
          git pull --rebase --autostash origin main
          git push
