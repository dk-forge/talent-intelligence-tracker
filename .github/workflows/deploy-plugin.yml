name: deploy-plugin

# DORMANT until WP_PLUGIN_REMOTE_DIR exists and the owner has read the guard
# output once. Uncomment the push trigger to arm.
on:
  # push:
  #   branches: [main]
  #   paths: ['wordpress-plugin/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check but upload nothing'
        type: boolean
        default: true
      probe:
        description: 'List the FTP tree and exit. Read only, uploads nothing.'
        type: boolean
        default: false

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read only. Finds where WordPress actually lives, because an FTP account
      # is usually chrooted to its own home and an absolute-looking path from
      # the control panel is often not what the FTP session sees.
      - name: Probe the FTP tree
        if: ${{ inputs.probe }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for DIR in / /blog /wp-content /wp-content/plugins /blog/wp-content/plugins; do
            echo "===== $DIR ====="
            lftp -c "
              set ftp:ssl-force true;
              set ssl:verify-certificate no;
              open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
              cls -1 '$DIR';
            " 2>&1 | head -40 || echo "(not listable)"
          done

      - name: Stop after probing
        if: ${{ inputs.probe }}
        run: |
          echo "Probe only. Nothing was uploaded."
          exit 0

      - uses: shivammathur/setup-php@v2
        if: ${{ !inputs.probe }}
        with:
          php-version: '8.2'

      # A syntax error in a WordPress plugin fatals the whole site section.
      # Nothing uploads until every file parses.
      - name: Lint every PHP file
        if: ${{ !inputs.probe }}
        run: |
          set -e
          find wordpress-plugin -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      # THE GUARD. The AI Layoff Tracker is live on the same host. Uploading
      # this plugin over its directory would take down a running product, so
      # the target path is checked before anything connects.
      - name: Refuse to deploy anywhere but our own plugin directory
        if: ${{ !inputs.probe }}
        env:
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::WP_PLUGIN_REMOTE_DIR is not set."
            exit 1
          fi
          echo "Target: $REMOTE_DIR"

          case "$REMOTE_DIR" in
            *ai-layoff-tracker*)
              echo "::error::Target contains 'ai-layoff-tracker'. That is the LIVE sibling product. Refusing."
              exit 1 ;;
          esac

          case "$REMOTE_DIR" in
            */talent-intelligence-tracker|*/talent-intelligence-tracker/) ;;
            *)
              echo "::error::Target must end with /talent-intelligence-tracker. Got: $REMOTE_DIR"
              exit 1 ;;
          esac

          case "$REMOTE_DIR" in
            */wp-content/plugins/*) ;;
            *)
              echo "::error::Target must sit under wp-content/plugins/. Got: $REMOTE_DIR"
              exit 1 ;;
          esac

          echo "Guard passed."

      # Second guard, on the remote side: prove the target really is inside a
      # WordPress install before mirroring anything into it. Deliberately no
      # default value anywhere in this file — a default is how files land in
      # the wrong folder when a secret goes missing.
      - name: Prove the target is a WordPress install
        if: ${{ !inputs.dry_run && !inputs.probe }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          WP_ROOT="$(dirname "$(dirname "$(dirname "$REMOTE_DIR")")")"
          echo "Expecting wp-config.php in $WP_ROOT"
          # No redirect inside the lftp script: lftp parses "2>/dev/null" as a
          # second path to list, not as a shell redirect.
          LISTING=$(lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
            cls -1 '$WP_ROOT';
          " 2>&1 || true)
          FOUND=$(printf '%s\n' "$LISTING" | grep -c 'wp-config\.php' || true)
          if [ "$FOUND" -eq 0 ]; then
            echo "Listing of $WP_ROOT was:"
            printf '%s\n' "$LISTING" | head -30
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No wp-config.php at $WP_ROOT. The target is not inside a WordPress install. Refusing."
            exit 1
          fi
          echo "WordPress install confirmed."

      - name: Confirm the version was bumped
        if: ${{ !inputs.probe }}
        run: |
          set -e
          FILE=wordpress-plugin/talent-intelligence-tracker/talent-intelligence-tracker.php
          HEADER=$(grep -m1 '^ \* Version:' "$FILE" | sed 's/.*Version: *//')
          CONST=$(grep -m1 "define('TIT_VERSION'" "$FILE" | sed "s/.*'\([0-9.]*\)'.*/\1/")
          echo "header=$HEADER const=$CONST"
          if [ "$HEADER" != "$CONST" ]; then
            echo "::error::Version header ($HEADER) and TIT_VERSION ($CONST) disagree."
            exit 1
          fi
          # FTP bypasses activation hooks, so the version bump is the ONLY
          # trigger for migrations and cache flushes. Shipping without one
          # means the new code runs against the old table.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV=$(git show HEAD~1:"$FILE" 2>/dev/null | grep -m1 "define('TIT_VERSION'" | sed "s/.*'\([0-9.]*\)'.*/\1/" || echo "")
            if [ -n "$PREV" ] && [ "$PREV" = "$CONST" ]; then
              echo "::warning::TIT_VERSION unchanged since the previous commit. Migrations and cache flush will not run."
            fi
          fi

      - name: Upload over FTPS
        if: ${{ !inputs.dry_run && !inputs.probe }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
            mirror --reverse --delete --verbose \
              wordpress-plugin/talent-intelligence-tracker '$REMOTE_DIR';
          "

      - name: Dry run notice
        if: ${{ inputs.dry_run && !inputs.probe }}
        run: |
          echo "Dry run: lint and guards passed, nothing was uploaded."

      # The upload proves bytes moved. It does not prove what those bytes
      # RENDER as, and on 2026-08-11 that gap was the whole defect: a rule in
      # the WordPress database beat every token this plugin owns, and only in
      # the dark scheme, so every check in the repo read green while dozens of
      # text elements shipped at about 1:1. This resolves the cascade in real
      # Chrome against the bare url. It runs after the mirror, so a deploy that
      # publishes a contrast regression says so in its own run.
      #
      # Not gated on dry_run alone: there is nothing new to measure when
      # nothing was uploaded. Chrome is preinstalled on the runner and both
      # scripts are stdlib-only, so this installs nothing.
      - name: Check what the deployed page renders as
        if: ${{ !inputs.dry_run && !inputs.probe }}
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          # The CDN edge holds the previous build for a few minutes.
          sleep 60
          python3 contrast_audit.py --json contrast.json

      - name: Keep the contrast measurement
        if: ${{ always() && !inputs.dry_run && !inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: contrast-after-deploy
          path: contrast.json
          if-no-files-found: warn
          retention-days: 30
