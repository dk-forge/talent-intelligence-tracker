name: deploy-plugin

# DORMANT until WP_PLUGIN_REMOTE_DIR exists and the owner has read the guard
# output once. Uncomment the push trigger to arm.
on:
  # push:
  #   branches: [main]
  #   paths: ['wordpress-plugin/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check but upload nothing'
        type: boolean
        default: true
      probe:
        description: 'List the FTP tree and exit. Read only, uploads nothing.'
        type: boolean
        default: false

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

# WHY THIS BLOCK EXISTS. On 2026-08-19 run 32207135840 sat in "Prove the target
# is a WordPress install" -- a READ-ONLY `cls` listing -- for 20 minutes and was
# killed by the job ceiling. It did not run slowly; it HUNG, and the reason is a
# default: lftp's `net:max-retries` is 0, which means UNLIMITED. Against an FTP
# control channel that accepts a connection and then never answers (Bluehost had
# a blip that same minute, which is also why /blog served a maintenance page),
# lftp reconnects forever and nothing below the job ceiling ever stops it.
#
# So every lftp invocation here now opens with these settings. `timeout-minutes`
# can only kill a job; it can never unwind a half-finished transfer. The bound
# has to live INSIDE lftp, which is what these five lines are.
#
# Do NOT answer a future hang by raising timeout-minutes. 20 is ~3x the measured
# worst case and clipping a slow FTP session is how a live deploy becomes a
# half-uploaded plugin tree. A run that exceeds it is hung, not slow.
env:
  LFTP_SETTINGS: |
    set ftp:ssl-force true;
    set ssl:verify-certificate no;
    set net:max-retries 3;
    set net:timeout 20;
    set net:reconnect-interval-base 5;
    set net:reconnect-interval-max 30;
    set dns:fatal-timeout 20;

jobs:
  deploy:
    runs-on: ubuntu-latest
    # SIZED FROM MEASUREMENT, 2026-08-13: over the last 60 successful runs the
    # median is 0.8 min, but that median is two eras averaged. Everything before
    # 2026-08-10 ran in 0.6 to 1.4; the four runs since the rendered-contrast
    # step was added ran 6.4, 6.4, 6.5 and 6.7. So the honest maximum is 6.7 and
    # the honest median is the current era's ~6.45. 20 is ~3x both.
    #
    # Deliberately generous rather than snug: this job is dispatched by hand at
    # the moment someone wants the site updated, and a ceiling that clips a slow
    # FTP session would turn a live deploy into a half-uploaded plugin tree.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # THIS SHA'S OWN TESTS MUST BE GREEN.
      #
      # On 2026-08-19 a deploy was dispatched onto a main whose `tests` run was
      # RED with a PHP fatal. That fatal turned out to be a harness gap rather
      # than a live fault, but nothing in this workflow knew that or could have
      # known it -- it was willing to push a tree its own suite was failing on,
      # onto a host that also serves a live sibling product.
      #
      # Deliberately NOT a hard block on "no run found": tests may still be
      # queueing when someone dispatches, and turning that into a refusal makes
      # the deploy unusable at exactly the moment it is wanted. A conclusive
      # `failure` is the only thing that stops the job; anything else warns and
      # continues, so this can never be the reason a live fix cannot ship.
      # A dry run is not a deploy, so it is exempt.
      - name: Refuse to deploy a SHA whose tests are failing
        if: ${{ !inputs.dry_run && !inputs.probe }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONC=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?head_sha=${{ github.sha }}&per_page=10" \
                   --jq '[.workflow_runs[] | select(.status=="completed") | .conclusion] | first // ""' 2>/dev/null || echo "")
          echo "tests conclusion for ${{ github.sha }}: ${CONC:-<none>}"
          if [ "$CONC" = "failure" ]; then
            echo "::error::tests is RED on this SHA. Fix the suite, or dispatch from a SHA that is green. Refusing to deploy."
            exit 1
          fi
          if [ "$CONC" != "success" ]; then
            echo "::warning::No conclusive tests result for this SHA (got '${CONC:-<none>}'). Proceeding, but this deploy is unverified."
          fi

      # Read only. Finds where WordPress actually lives, because an FTP account
      # is usually chrooted to its own home and an absolute-looking path from
      # the control panel is often not what the FTP session sees.
      - name: Probe the FTP tree
        if: ${{ inputs.probe }}
        timeout-minutes: 5
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for DIR in / /blog /wp-content /wp-content/plugins /blog/wp-content/plugins; do
            echo "===== $DIR ====="
            lftp -c "
              $LFTP_SETTINGS
              open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
              cls -1 '$DIR';
            " 2>&1 | head -40 || echo "(not listable)"
          done

      - name: Stop after probing
        if: ${{ inputs.probe }}
        run: |
          echo "Probe only. Nothing was uploaded."
          exit 0

      - uses: shivammathur/setup-php@v2
        if: ${{ !inputs.probe }}
        with:
          php-version: '8.2'

      # A syntax error in a WordPress plugin fatals the whole site section.
      # Nothing uploads until every file parses.
      - name: Lint every PHP file
        if: ${{ !inputs.probe }}
        run: |
          set -e
          find wordpress-plugin -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      # THE GUARD. The AI Layoff Tracker is live on the same host. Uploading
      # this plugin over its directory would take down a running product, so
      # the target path is checked before anything connects.
      - name: Refuse to deploy anywhere but our own plugin directory
        if: ${{ !inputs.probe }}
        env:
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::WP_PLUGIN_REMOTE_DIR is not set."
            exit 1
          fi
          echo "Target: $REMOTE_DIR"

          case "$REMOTE_DIR" in
            *ai-layoff-tracker*)
              echo "::error::Target contains 'ai-layoff-tracker'. That is the LIVE sibling product. Refusing."
              exit 1 ;;
          esac

          case "$REMOTE_DIR" in
            */talent-intelligence-tracker|*/talent-intelligence-tracker/) ;;
            *)
              echo "::error::Target must end with /talent-intelligence-tracker. Got: $REMOTE_DIR"
              exit 1 ;;
          esac

          case "$REMOTE_DIR" in
            */wp-content/plugins/*) ;;
            *)
              echo "::error::Target must sit under wp-content/plugins/. Got: $REMOTE_DIR"
              exit 1 ;;
          esac

          echo "Guard passed."

      # Second guard, on the remote side: prove the target really is inside a
      # WordPress install before mirroring anything into it. Deliberately no
      # default value anywhere in this file — a default is how files land in
      # the wrong folder when a secret goes missing.
      - name: Prove the target is a WordPress install
        if: ${{ !inputs.dry_run && !inputs.probe }}
        # A read-only listing. If this needs 4 minutes it is not listing.
        timeout-minutes: 4
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          WP_ROOT="$(dirname "$(dirname "$(dirname "$REMOTE_DIR")")")"
          echo "Expecting wp-config.php in $WP_ROOT"
          # No redirect inside the lftp script: lftp parses "2>/dev/null" as a
          # second path to list, not as a shell redirect.
          LISTING=$(lftp -c "
            $LFTP_SETTINGS
            open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
            cls -1 '$WP_ROOT';
          " 2>&1 || true)
          FOUND=$(printf '%s\n' "$LISTING" | grep -c 'wp-config\.php' || true)
          if [ "$FOUND" -eq 0 ]; then
            echo "Listing of $WP_ROOT was:"
            printf '%s\n' "$LISTING" | head -30
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No wp-config.php at $WP_ROOT. The target is not inside a WordPress install. Refusing."
            exit 1
          fi
          echo "WordPress install confirmed."

      - name: Confirm the version was bumped
        if: ${{ !inputs.probe }}
        run: |
          set -e
          FILE=wordpress-plugin/talent-intelligence-tracker/talent-intelligence-tracker.php
          HEADER=$(grep -m1 '^ \* Version:' "$FILE" | sed 's/.*Version: *//')
          CONST=$(grep -m1 "define('TIT_VERSION'" "$FILE" | sed "s/.*'\([0-9.]*\)'.*/\1/")
          echo "header=$HEADER const=$CONST"
          if [ "$HEADER" != "$CONST" ]; then
            echo "::error::Version header ($HEADER) and TIT_VERSION ($CONST) disagree."
            exit 1
          fi
          # FTP bypasses activation hooks, so the version bump is the ONLY
          # trigger for migrations and cache flushes. Shipping without one
          # means the new code runs against the old table.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV=$(git show HEAD~1:"$FILE" 2>/dev/null | grep -m1 "define('TIT_VERSION'" | sed "s/.*'\([0-9.]*\)'.*/\1/" || echo "")
            if [ -n "$PREV" ] && [ "$PREV" = "$CONST" ]; then
              echo "::warning::TIT_VERSION unchanged since the previous commit. Migrations and cache flush will not run."
            fi
          fi

      - name: Upload over FTPS
        if: ${{ !inputs.dry_run && !inputs.probe }}
        # The mirror itself. Measured era is ~1 min of transfer; 10 is generous
        # without being the job ceiling, so a stuck upload is named as the
        # stuck step rather than showing up as an unattributed job timeout.
        timeout-minutes: 10
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_DIR: ${{ secrets.WP_PLUGIN_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            $LFTP_SETTINGS
            open -u '$FTP_USERNAME','$FTP_PASSWORD' -p '${FTP_PORT:-21}' '$FTP_HOST';
            mirror --reverse --delete --continue --verbose \
              wordpress-plugin/talent-intelligence-tracker '$REMOTE_DIR';
          "

      - name: Dry run notice
        if: ${{ inputs.dry_run && !inputs.probe }}
        run: |
          echo "Dry run: lint and guards passed, nothing was uploaded."

      # The upload proves bytes moved. It does not prove what those bytes
      # RENDER as, and on 2026-08-11 that gap was the whole defect: a rule in
      # the WordPress database beat every token this plugin owns, and only in
      # the dark scheme, so every check in the repo read green while dozens of
      # text elements shipped at about 1:1. This resolves the cascade in real
      # Chrome against the bare url. It runs after the mirror, so a deploy that
      # publishes a contrast regression says so in its own run.
      #
      # Not gated on dry_run alone: there is nothing new to measure when
      # nothing was uploaded. Chrome is preinstalled on the runner and both
      # scripts are stdlib-only, so this installs nothing.
      - name: Check what the deployed page renders as
        if: ${{ !inputs.dry_run && !inputs.probe }}
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          # The CDN edge holds the previous build for a few minutes.
          sleep 60
          python3 contrast_audit.py --json contrast.json

      - name: Keep the contrast measurement
        if: ${{ always() && !inputs.dry_run && !inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: contrast-after-deploy
          path: contrast.json
          if-no-files-found: warn
          retention-days: 30
