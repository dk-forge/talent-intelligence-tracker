name: correct-sec-filer-name

# Re-issue the published 8-K rows whose headline carries a mangled filer name.
# collectors/sec_edgar.py writes its own headline out of EDGAR's display_names,
# and the rule that cut EDGAR's ticker and CIK groups off that string was wrong
# in two directions: it never matched a ticker LIST, so 126 headlines still read
# "BED BATH & BEYOND, INC.  (BBBY, BBBY-WT) 8-K filing ...", and it matched
# inside a company's own name, so one reads "Jerash Holdings , Inc.". See
# correct_sec_filer_name.py.
#
# headline is an input to content_hash, so this is not a /correct in place:
# each row is withdrawn from the site and its new revision published, exactly
# as correct-sec-pillar.yml does it. Runs here rather than from a laptop
# because this is where WP_API_KEY lives.
#
# NEVER dispatch this directly. It shares the talent-collect lock, and
# dispatching past a run already waiting EVICTS that run with no logs anywhere.
# Queue it:
#
#   gh workflow run drain-writers.yml \
#      -f enqueue=correct-sec-filer-name.yml \
#      -f inputs_json='{"dry_run":"false"}' \
#      -f reason='127 published 8-K headlines carry a mangled EDGAR filer name'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change and write nothing'
        type: boolean
        default: true
      limit:
        description: 'Stop after N rows (blank for all)'
        type: string
        default: ''
      force:
        description: 'Proceed even if an implausible share of rows would move'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db, matching
  # correct-sec-pillar.yml, correct-form-d.yml, retract.yml and the backfills.
  # Two writers both end with reset-to-origin-then-copy-our-file-back, so
  # whichever pushes second silently destroys the other's rows.
  group: talent-collect
  # This WITHDRAWS and RE-ISSUES published rows. A run killed halfway leaves
  # rows revised locally and still live on the site, which the script resumes
  # from cleanly, but only if it is allowed to finish rather than being
  # cancelled by the next dispatch.
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    # 127 retractions are one request each and the republication goes in
    # batches of 25, so this is short. Generous anyway: a timeout mid-run is
    # the failure mode to avoid.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      - name: Correct
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          # No `|| true`: a failed retraction or batch must fail the run, not
          # pass quietly.
          python correct_sec_filer_name.py $ARGS

      - name: Commit the database
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: re-issue the 8-K rows whose headline carried a mangled filer name $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another writer may have landed while this ran. Rebase rather than
          # force: the other run's rows are as real as ours.
          git pull --rebase --autostash origin main
          git push
