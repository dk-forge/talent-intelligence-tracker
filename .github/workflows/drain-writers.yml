# The queue that stops a database writer disappearing without anyone knowing.
#
# THE DEFECT (measured 2026-07-29)
# --------------------------------
# Every writer shares the `talent-collect` concurrency group with
# cancel-in-progress: false. That lock is correct and stays. But GitHub keeps
# exactly ONE pending run per group: while one run executes and a second waits,
# dispatching a THIRD silently evicts the waiting one. It ends `cancelled`
# having created no jobs — no steps, no logs, no annotation, nothing that says
# work was lost. Seven writer runs went that way in two hours behind a GDELT
# backfill, and every one was reported to the owner as "queued".
#
# THE FIX
# -------
# Eviction is only possible when something is already waiting. This workflow
# dispatches the next ticket ONLY into an empty group, so there is never a
# second pending run and queued work cannot be evicted. Work waits in
# data/writer_queue.json — committed, durable, and readable — instead of in
# GitHub's single lossy slot.
#
# It also reads the run list every tick and shouts about any writer run that
# ended cancelled without creating a job, including ones dispatched directly
# rather than queued. Those cannot be replayed (the API does not expose a
# dispatched run's inputs), so they go red and name themselves.
#
# THIS WORKFLOW IS DELIBERATELY NOT IN THE `talent-collect` GROUP. It writes no
# data of its own, and it must be able to run while the lock is held — a drainer
# that waits for the lock could never drain it.
name: drain-writers

on:
  # The safety net. Every tick is a few seconds; the fast path below is what
  # normally moves the queue.
  schedule:
    - cron: '*/15 * * * *'

  # The fast path: the moment any lock holder finishes, look for the next
  # ticket. Also fires when a run is evicted, which is how displacement gets
  # noticed in seconds rather than at the next cron.
  workflow_run:
    types: [completed]
    workflows:
      - archive-sources
      - backfill-2026
      - backfill-funding-2026
      - backfill-funding-bulk
      - backfill-gdelt-2026
      - backfill-gnews-2026
      - backfill-press-2026
      - backfill-structured-2026
      - benchmark-diff
      - collect
      - collect national press
      - collect-structured
      - correct-city-country
      - correct-company-key
      - correct-form-d
      - correct-form-d-overcount
      - correct-funding-amount
      - correct-layoff-scope
      - correct-sec-pillar
      - enrich
      - link-check
      - recall
      - retract
      - tripwire

  workflow_dispatch:
    inputs:
      enqueue:
        description: 'Workflow file to queue, e.g. correct-form-d.yml (blank = just drain)'
        required: false
        default: ''
      inputs_json:
        description: 'Its inputs as JSON, e.g. {"dry_run":"false"}'
        required: false
        default: ''
      reason:
        description: 'Why, for the record (also the note when resolving)'
        required: false
        default: ''
      resolve:
        description: 'Run id of an evicted run to mark handled, or "all"'
        required: false
        default: ''
      priority:
        description: 'Lower leaves first. Blank uses the default (backfills go last).'
        required: false
        default: ''

permissions:
  contents: write   # commit the queue file
  actions: write    # dispatch the next writer

concurrency:
  # Its own group, NOT the writers' one. cancel-in-progress stays false so a
  # tick is never killed between committing a ticket as dispatched and actually
  # dispatching it; a tick that loses its own pending slot costs one cycle and
  # no data, because every tick reconciles from scratch.
  group: drain-writers
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # A fine-grained PAT with actions:write is preferred; GITHUB_TOKEN is the
      # fallback. Either way the dispatch is VERIFIED below rather than assumed,
      # because a dispatch that quietly creates no run would be the same class
      # of bug this workflow exists to kill.
      # Dispatch inputs arrive through the environment, never interpolated into
      # the script. A `${{ }}` inside a run block is pasted in as text before
      # the shell sees it, so a quote in a reason string would end the command.
      - name: Queue the request, if this run carried one
        if: ${{ inputs.enqueue != '' }}
        env:
          WF: ${{ inputs.enqueue }}
          WF_INPUTS: ${{ inputs.inputs_json }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          PRIORITY: ${{ inputs.priority }}
        run: |
          set -euo pipefail
          ARGS=(enqueue "$WF" --inputs "$WF_INPUTS" --reason "$REASON" --by "$ACTOR")
          [ -n "$PRIORITY" ] && ARGS+=(--priority "$PRIORITY")
          python writer_queue.py "${ARGS[@]}"

      # Triage the backlog without needing a checkout. An orphan stays loud
      # until a human decides; deciding NOT to re-run something is a legitimate
      # decision, and this is where it gets recorded.
      - name: Resolve an orphan, if this run asked to
        if: ${{ inputs.resolve != '' }}
        env:
          TARGET: ${{ inputs.resolve }}
          NOTE: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: python writer_queue.py resolve "$TARGET" --note "$NOTE (by $ACTOR)"

      - name: Read what is actually running
        env:
          GH_TOKEN: ${{ secrets.WRITER_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        # Deep enough to still see a run that was evicted several hours ago;
        # this repo can turn over sixty runs in two hours.
        run: python writer_queue_runs.py --limit 200 --out "$RUNNER_TEMP/runs.json"

      - name: Reconcile, and pick at most one thing to dispatch
        id: tick
        run: |
          set +e
          python writer_queue.py tick \
            --runs "$RUNNER_TEMP/runs.json" \
            --emit "$RUNNER_TEMP/plan.json" \
            --ref main
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/plan.json" ]; then
            echo "planned=1" >> "$GITHUB_OUTPUT"
          fi

      # Committed BEFORE the dispatch on purpose. If this run dies in between,
      # the ticket is already recorded as dispatched, so the next tick binds it
      # to its run instead of dispatching it a second time. The opposite order
      # can double-apply a correction.
      - name: Commit the queue
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/writer_queue.json
          if git diff --staged --quiet; then
            echo "Queue unchanged."
            exit 0
          fi
          git commit -q -m "queue: drain tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto current main."
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 3))
          done
          echo "::error::could not commit the writer queue after 5 attempts"
          exit 1

      # THE DISPATCH MUST NEVER FAIL QUIETLY, AND IT DID.
      #
      # 2026-07-30T17:42Z: this step ran `gh api .../dispatches` under
      # `set -euo pipefail`. The API answered
      #     Unexpected inputs provided: ["slice"] (HTTP 422)
      # because the ticket carried an input backfill-gdelt-2026.yml does not
      # declare. `set -e` killed the step ON THAT LINE — so the verification
      # loop below it never ran, the requeue below THAT never ran, and the
      # ticket was left in state `dispatched` bound to a run that does not
      # exist. Every tick for the next several hours then found zero tickets in
      # state `queued`, emitted no plan, skipped this step and exited GREEN.
      #
      # Three things changed. The API call no longer runs under `set -e`, so
      # its refusal is caught and recorded instead of aborting the step. A
      # refusal on the INPUTS is permanent, so the ticket is marked failed
      # rather than retried forever. And the queue write that records either
      # outcome is pushed with the same retry loop as the main commit, because
      # `git push || true` on a rejected push is another way to lose the record.
      - name: Dispatch it
        if: ${{ steps.tick.outputs.planned == '1' }}
        env:
          GH_TOKEN: ${{ secrets.WRITER_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.WRITER_QUEUE_TOKEN != '' && 'yes' || 'no' }}
        run: |
          set -euo pipefail

          # Record whatever we decided about the ticket, then go red. Shared by
          # both failure paths so neither can forget to persist it.
          # Written with `if` rather than `&&` on purpose: under `set -e` a
          # failing left-hand side of `&&` aborts the whole step, which is the
          # class of accident that lost the requeue in the first place.
          record () {
            git config user.name  'talent-intel-bot'
            git config user.email 'bot@users.noreply.github.com'
            git add data/writer_queue.json
            if git diff --staged --quiet; then
              echo "::warning::nothing to record for $1 — the queue did not change"
              return 0
            fi
            git commit -q -m "queue: $1"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Recorded: $1"
                return 0
              fi
              git pull --rebase --autostash origin main || true
              sleep $((attempt * 3))
            done
            echo "::error::could not push the queue after recording: $1"
            return 1
          }

          WF=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/plan.json'))['workflow'])")
          TICKET=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/plan.json'))['ticket'])")
          python -c "import json;d=json.load(open('$RUNNER_TEMP/plan.json'));print(json.dumps(d['body']))" \
            > "$RUNNER_TEMP/body.json"

          echo "Dispatching $WF for ticket $TICKET (WRITER_QUEUE_TOKEN present: $HAVE_PAT)"
          if [ "$HAVE_PAT" != "yes" ]; then
            echo "::warning::WRITER_QUEUE_TOKEN is not set, so this dispatch uses the"
            echo "::warning::default GITHUB_TOKEN, which GitHub forbids from creating"
            echo "::warning::workflow runs in many configurations. If the dispatch is"
            echo "::warning::refused below, that is the first thing to fix."
          fi

          # Run ids increase monotonically, so "did a NEW dispatch-triggered run
          # appear for this workflow" is answerable exactly, without a time
          # window that a scheduled run can wander into.
          BEFORE=$(gh run list --workflow "$WF" -L 1 --json databaseId --jq '.[0].databaseId // 0')
          # A non-numeric answer would make the jq comparison below nonsense and
          # the `-gt` test noisy; 0 means "any new run counts", which is safe.
          case "$BEFORE" in ''|*[!0-9]*) BEFORE=0 ;; esac

          # --input keeps the recorded inputs as JSON end to end; nothing from a
          # ticket is ever interpolated into a shell command.
          set +e
          RESP=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
                   --input "$RUNNER_TEMP/body.json" 2>&1)
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "::error::the dispatch of $WF for ticket $TICKET was REFUSED"
            echo "::error::(gh exit $RC). The API said: $RESP"
            # A refusal about the inputs is deterministic: the same ticket will
            # be refused identically on every future tick, so requeueing it is
            # an infinite silent retry. Anything else (a token that may not
            # create runs, a 5xx) is worth another go.
            case "$RESP" in
              *"Unexpected inputs"*|*"Required input"*|*"Invalid input"*|*"Unexpected input"*)
                echo "::error::These inputs do not match what $WF declares under"
                echo "::error::workflow_dispatch. Re-queue it with the declared names;"
                echo "::error::writer_queue.py enqueue now refuses this at typing time."
                python writer_queue.py dispatch-failed "$TICKET" --permanent \
                  --note "API refused the inputs: $RESP"
                record "$TICKET refused (bad inputs)"
                ;;
              *)
                if [ "$HAVE_PAT" != "yes" ]; then
                  echo "::error::No WRITER_QUEUE_TOKEN is set. Add a fine-grained PAT"
                  echo "::error::with actions:write as that secret; the default"
                  echo "::error::GITHUB_TOKEN cannot create workflow runs."
                fi
                python writer_queue.py dispatch-failed "$TICKET" \
                  --note "dispatch refused: $RESP"
                record "$TICKET requeued (dispatch refused)"
                ;;
            esac
            exit 1
          fi

          # VERIFY. `gh api` answering 204 is not proof a run exists, and a
          # dispatch that creates nothing would be silent in exactly the way
          # this workflow exists to prevent.
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            NEW=$(gh run list --workflow "$WF" -L 10 --json databaseId,event \
                    --jq "[.[] | select(.databaseId > $BEFORE) | select(.event==\"workflow_dispatch\")] | length")
            if [ "${NEW:-0}" -gt 0 ]; then
              echo "Run created for $WF."
              exit 0
            fi
            echo "No run yet for $WF (attempt $attempt; newest before dispatch was $BEFORE)."
          done

          echo "::error::dispatched $WF and the API accepted it, but no run ever"
          echo "::error::appeared. If GH_TOKEN is the default GITHUB_TOKEN and the"
          echo "::error::repository forbids it from creating runs, add a fine-grained"
          echo "::error::PAT with actions:write as the WRITER_QUEUE_TOKEN secret."
          echo "::error::(WRITER_QUEUE_TOKEN present: $HAVE_PAT.) Ticket $TICKET is"
          echo "::error::going back in the queue, not being dropped — and the second"
          echo "::error::time this happens to it, the queue reports it as a problem."
          python writer_queue.py dispatch-failed "$TICKET" \
            --note "accepted by the API but no run appeared"
          record "$TICKET requeued (dispatch created no run)"
          exit 1

      # Last, so the queue is always committed and the dispatch always
      # attempted before the run is allowed to go red.
      #
      # rc=2 means a NEW needs-human item (or one ignored for RE_RED_HOURS) —
      # red once per item, not once per tick. An item already reported on an
      # earlier tick keeps the tick GREEN and is printed as a warning instead:
      # it stays listed in `writer_queue.py status` and ops_status [2b] until a
      # human acknowledges or resolves it. 2026-07-26..08-02 the old
      # every-tick red produced 180 red runs (one GitHub failure email each)
      # for a handful of causes; writer_queue.select_red is the fix and
      # tests/test_writer_queue.py pins it.
      - name: Fail loudly if anything NEW needs a human
        if: ${{ always() && steps.tick.outputs.rc != '0' }}
        run: |
          echo "::error::the writer queue has NEW items that need a human — see the"
          echo "::error::reconcile step above, or run: python writer_queue.py status"
          exit 1
