name: collect national press

# One collector reading every verified feed in data/sources_catalogue.csv.
#
# Separate from collect.yml on purpose. The news collectors there share a
# search vocabulary and a locale rotation; this one has neither — the catalogue
# IS its population — and its failure mode is different too: a feed going dark
# is a country going dark, and that has to be visible on its own schedule
# rather than averaged into a run that also fetched Google News.
#
# Runs at 09:00 and 21:00 UTC, deliberately offset from collect.yml's 06:00 and
# 18:00 so the two never queue behind each other for the same database lock.
#
# COST. Fetching feeds is free. What costs money is the read-through, and that
# is bounded by classify.READTHROUGH_CAP regardless of how many feeds the
# catalogue lists, with the two-stage gate throwing most candidates away for
# about 1/40th of a full call first. Adding a country to the catalogue
# therefore costs bandwidth, not budget.
#
# This collector uses the module default, and the default is sized to THIS
# collector because it is the hungriest: measured demand is 249 reads a run
# against 200 bought, and the 49 it could not buy on 2026-07-30 were stories in
# Hebrew, German, Serbian, Vietnamese and Korean. 75 is its share of what the
# monthly allowance pays for; `python3 cost_projection.py` re-derives it from
# the ledger. Which 75 of the 249 get read is decided by
# pipeline/candidate_rank.py, which gives every country's best story a place
# before any country's second — so a capped run buys breadth rather than a
# random slice.
#
# spend.py runs first and DEGRADES rather than halting: past the ceiling the
# feeds are still fetched and the free deterministic extraction still stores
# rows; only the paid reads stop.
on:
  schedule:
    # 11:00, NOT 09:00, and that is the whole reason this collector kept
    # reading stale. collect-structured.yml also fires at '0 9 * * *' and shares
    # the `talent-collect` lock. With cancel-in-progress: false GitHub keeps at
    # most ONE run pending per group, so when a third arrives it cancels the one
    # already waiting — and the morning press run was always that one. It was
    # cancelled on 07-29, 07-31, 08-01 and 08-02 while the 21:00 slot, which
    # nothing else contends, succeeded every time. So a collector scheduled
    # twice a day was effectively running once, ~24h apart, against a 14h leash
    # (staleness.TWICE_DAILY_HOURS) that was correctly describing the schedule
    # it was supposed to keep.
    #
    # The slot has to stay inside [07:00, 11:00] to keep both gaps under that
    # leash while leaving the 21:00 run — the one that has never failed —
    # exactly where it is. 08:00 is recall's Monday cron and 09:00 is
    # collect-structured, so 11:00 it is: gaps of 10h and 13h.
    #
    # This is contention, not the collector. The 2026-08-01 feed audit is
    # unrelated: the 21:15 run that evening pulled 10,225 candidates and stored
    # 55 rows normally, and the cancelled runs were killed before their first
    # step.
    # Once daily since 2026-08-14, same owner decision as collect.yml.
    - cron: '0 23 * * *'   # an hour behind collect, same owner decision
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be stored, write nothing'
        type: boolean
        default: false
      limit:
        description: 'Cap candidates sent to the classifier (blank = the default cap)'
        type: string
        default: ''

# The same lock every database writer uses. Two writers both end with
# reset-to-origin then copy-our-file-back, so overlapping runs silently destroy
# each other's rows.
concurrency:
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-press:
    runs-on: ubuntu-latest
    # SIZED FROM MEASUREMENT, 2026-08-13: median 19.1 min, max 66.2 over the
    # last 24 successful runs. Same shape as collect.yml — a tight recent band
    # (13.8 to 24.3 since 2026-08-02) over an older tail at 56.7, 60.4 and 66.2
    # — so again sized on the tail: 120 is ~1.8x the honest maximum and ~6x the
    # median. Unbounded until now, and this one also holds OPENROUTER_API_KEY.
    # READTHROUGH_CAP bounds the spend per run; this bounds the hung run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # The ceiling DEGRADES, it does not halt. --degrade never fails this
      # step: past 90% of the monthly allowance it sets TIT_PAID_READS=off for
      # the rest of the job, so the free prefilter, deterministic extraction
      # and both dedup layers keep running and every candidate that would have
      # cost money defers UNMARKED for a later run. On 2026-07-30 --enforce
      # took the whole job red at $9.47 of $10 and nothing at all was
      # collected for the rest of the month; that is an outage protecting a
      # budget most of this pipeline does not spend.
      - name: Check the spend ceiling
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py --degrade

      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          python run_collect.py \
            --source national_press \
            ${{ inputs.dry_run && '--dry-run' || '--publish' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # The per-feed ledger, printed into the run log as well as committed. A
      # publisher that went dark three weeks ago is invisible in an aggregate
      # that still returns hundreds of items from the other hundred feeds.
      - name: Per-feed health
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/national_press_health.json")
          if not p.exists():
              print("no ledger written — the collector did not reach its report step")
              raise SystemExit(0)
          d = json.loads(p.read_text())
          print(f"{d['live']}/{d['feeds']} feeds live at {d['run_at']}")
          for f in d["by_feed"]:
              if f["status"] != "ok":
                  print(f"  ::warning::{f['country']} — {f['name']} is "
                        f"{f['status']} ({f['detail']}) {f['url']}")
          PY

      - name: Status
        if: ${{ !inputs.dry_run }}
        run: python ops_status.py || true

      # Identical to collect.yml, and for the same reason: a run that collected
      # for several minutes and then lost its push has the only copy of those
      # records on the runner. `!cancelled()` rather than success(), because a
      # run that failed AFTER publishing still holds the seen_urls that stop the
      # next run paying for the same stories again.
      - name: Commit the database
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db data/talent_intel_cache.db data/national_press_health.json data/spend_month.json 2>/dev/null \
            || git add data/talent_intel.db data/talent_intel_cache.db
          # This run's per-candidate gate verdicts: the training set for the
          # classifier that replaces most of the paid gate
          # (docs/PLAN-gate-to-five-dollars.md). `-A` because a month closing
          # deletes the plain shard the ledger just gzipped.
          git add -A data/gate_labels 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          # The database MERGES; the health JSON is a whole-file snapshot with no
          # row identity, so it stays last-writer-wins. Copying the database the
          # same way is what cost 9,572 rows on 2026-07-28/29 (see merge_db.py).
          # The gate labels merge too — they are append-only lines, and a copy
          # would overwrite whatever another writer appended meanwhile.
          cp data/talent_intel.db "$RUNNER_TEMP/collected.db"
          cp data/talent_intel_cache.db "$RUNNER_TEMP/collected_cache.db"
          cp data/national_press_health.json "$RUNNER_TEMP/press_health.json" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gate_labels"
          cp -R data/gate_labels "$RUNNER_TEMP/gate_labels" 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/collected.db" data/talent_intel.db
            cp "$RUNNER_TEMP/press_health.json" data/national_press_health.json 2>/dev/null || true
            python merge_gate_labels.py "$RUNNER_TEMP/gate_labels" data/gate_labels || true
            git add data/talent_intel.db data/talent_intel_cache.db data/national_press_health.json 2>/dev/null \
              || git add data/talent_intel.db data/talent_intel_cache.db
            git add -A data/gate_labels 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi
            git commit -q -m "data: national press $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the database after 5 attempts. \
          This run's records exist only on the runner and are lost."
          exit 1
