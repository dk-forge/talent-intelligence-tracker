name: correct-site-pillar

# Re-file the published office openings under how_we_work, fill the site_event
# column they were collected without, and resolve the one story that is in the
# table twice because it was read under two pillars. See correct_site_pillar.py.
#
# Commit 71d17c2 fixed the classifier; it could not fix the rows collected
# while SCHEMA_HINT defined no pillar. No model is called here — a headline
# that says "opens new office" decides its own pillar, through the same
# validate.forced_pillar the Item 5.02 pass uses.
#
# pillar is an input to content_hash, so this is not a /correct in place: each
# row is withdrawn from the site and its new revision published. Runs here
# rather than from a laptop because this is where WP_API_KEY lives.
#
# NEVER dispatch this directly — queue it, or it can evict a pending writer:
#   gh workflow run drain-writers.yml -f enqueue=correct-site-pillar.yml \
#        -f inputs_json='{"dry_run":"false"}' -f reason='why'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change and write nothing'
        type: boolean
        default: true
      limit:
        description: 'Stop after N rows (blank for all)'
        type: string
        default: ''
      force:
        description: 'Proceed even if an implausible share of rows would move'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db, matching
  # correct-sec-pillar.yml, correct-form-d.yml, retract.yml and the backfills.
  # Asserted by tests/test_workflows.py.
  group: talent-collect
  # This WITHDRAWS and RE-ISSUES published rows. A run killed halfway leaves
  # rows revised locally and still live on the site, which the script resumes
  # from cleanly — but only if it is allowed to finish rather than being
  # cancelled by the next dispatch.
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    # Nine rows, one retraction request each, then one publish batch. The
    # generous ceiling is for the site being slow, not for the worklist.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Correct
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          # No `|| true`: a failed retraction or batch must fail the run, not
          # pass quietly.
          python correct_site_pillar.py $ARGS

      - name: Commit the database
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: re-file the office openings under how we work $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another writer may have landed while this ran. Rebase rather than
          # force: the other run's rows are as real as ours.
          #
          # Safe to rebase here for the reason correct-sec-pillar is, and NOT
          # for the reason correct-form-d is not: every change this pass makes
          # goes through store.revise(), so each one is a new (content_hash,
          # revision) row that a merge can carry. correct-form-d edits rows in
          # place and would be silently skipped by merge_db.py, which is why it
          # goes red instead.
          git pull --rebase --autostash origin main
          git push
