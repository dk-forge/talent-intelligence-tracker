name: correct-company-key

# Re-issue the rows whose stored company_key is not the key pipeline/vocab.py
# would compute for their name today. Three separate changes to that function
# left rows behind them spelled the old way: the `\b` legal-suffix strip that
# ate the "co" in "co-operative", the EMPLOYER_KEY_ALIASES merge of three
# employers recorded under two spellings each, and `lp`/`pbc` joining the
# suffix list after some rows were already stored. See correct_company_key.py.
#
# company_key is the first input to content_hash, so this is not a /correct in
# place: each row is withdrawn from the site and its new revision published.
# Runs here rather than from a laptop because this is where WP_API_KEY lives.
#
# ORDER MATTERS. Three of these employers are over the profile threshold and
# their /company/ URL changes with their key. Plugin 1.47.0 resolves a slug that
# only a superseded revision claims and 301s to the current one; deploy that
# BEFORE queueing this, or those three URLs 404 in between.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change and write nothing'
        type: boolean
        default: true
      limit:
        description: 'Stop after N rows (blank for all)'
        type: string
        default: ''
      force:
        description: 'Proceed even if an implausible share of rows would move'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db, matching
  # correct-form-d.yml, correct-sec-pillar.yml, retract.yml and the backfills.
  group: talent-collect
  # This WITHDRAWS and RE-ISSUES published rows. A run killed halfway leaves
  # rows revised locally and still live on the site, which the script resumes
  # from cleanly — but only if it is allowed to finish rather than being
  # cancelled by the next dispatch.
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    # 38 retractions are one request each and the republication goes in batches
    # of 25, so this is minutes. The budget is for the shared host's retry
    # pauses, not for the work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      - name: Correct
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          # No `|| true`: a failed retraction or batch must fail the run, not
          # pass quietly.
          python correct_company_key.py $ARGS

      - name: Commit the database
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: re-issue the rows whose company_key was stale $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another writer may have landed while this ran. Rebase rather than
          # force: the other run's rows are as real as ours.
          git pull --rebase --autostash origin main
          git push
