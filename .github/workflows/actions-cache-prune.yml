name: Prune Actions caches

# The repo's 10 GB Actions cache filled up (limits-watch, 2026-11-05). GitHub
# then evicts caches on its own, but builds slow down and the limits watch
# stays red. Weekly: delete caches unused for N days, then trim LRU to a
# 7 GB size target (age alone left it at 100%, 2026-11-10). The newest
# default-branch cache per key prefix is never deleted. Logic: cache_prune.py. Caches
# are rebuildable, so the worst case is one slower CI run.

on:
  schedule:
    - cron: '37 3 * * *'   # daily 03:37 UTC (weekly was not enough, cache stayed at 100%)
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete caches unused for more than this many days
        default: '2'
      target_gb:
        description: Then trim least-recently-used caches until total is at most this many GB
        default: '7'

permissions:
  actions: write

concurrency:
  group: actions-cache-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cache_prune.py
          sparse-checkout-cone-mode: false
      - name: Delete old caches, then trim to the size target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '2' }}
          TARGET_GB: ${{ inputs.target_gb || '7' }}
        run: python3 cache_prune.py
