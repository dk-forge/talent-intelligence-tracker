name: correct-sec-pillar

# Re-issue the published 8-K Item 5.02 filings that were filed under another
# pillar. The item IS "Departure of Directors or Certain Officers", so the
# pillar is a fact about the document; the model was asked anyway and sent 573
# of them elsewhere, mostly to rewards_comp, because a 5.02(e) filing spends
# most of its words on the incoming officer's pay package. See
# correct_sec_pillar.py.
#
# pillar is an input to content_hash, so this is not a /correct in place: each
# row is withdrawn from the site and its new revision published. Runs here
# rather than from a laptop because this is where WP_API_KEY lives.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change and write nothing'
        type: boolean
        default: true
      limit:
        description: 'Stop after N rows (blank for all)'
        type: string
        default: ''
      force:
        description: 'Proceed even if an implausible share of rows would move'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db, matching
  # correct-form-d.yml, retract.yml and the backfills. Two writers both end
  # with reset-to-origin-then-copy-our-file-back, so whichever pushes second
  # silently destroys the other's rows.
  group: talent-collect
  # This WITHDRAWS and RE-ISSUES published rows. A run killed halfway leaves
  # rows revised locally and still live on the site, which the script resumes
  # from cleanly — but only if it is allowed to finish rather than being
  # cancelled by the next dispatch.
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    # 573 retractions are one request each, and the republication goes in
    # batches of 25. Generous, but a timeout mid-run is the failure mode to
    # avoid.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Correct
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          # No `|| true`: a failed retraction or batch must fail the run, not
          # pass quietly.
          python correct_sec_pillar.py $ARGS

      - name: Commit the database
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: re-issue the item 5.02 filings under the leadership pillar $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another writer may have landed while this ran. Rebase rather than
          # force: the other run's rows are as real as ours.
          #
          # Five attempts, rebasing before each. A rebase and a push are two
          # commands and main can move between them; retract.yml lost exactly
          # that race on 2026-07-29 (run 30481782149) with a single attempt.
          # This job withdraws each row from the site and republishes its new
          # revision BEFORE this step runs, so a lost commit leaves the site
          # holding revisions the database does not record.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              # git cannot merge two SQLite files, so a conflict is not a race
              # that a retry will win. Abort and go red now.
              git rebase --abort || true
              echo "::error::correct-sec-pillar: data/talent_intel.db conflicts with"
              echo "::error::main, so these re-issues were NOT committed. The site has"
              echo "::error::already been updated. Re-queue it — never copy a database"
              echo "::error::file over main:"
              echo "::error::  gh workflow run drain-writers.yml \\"
              echo "::error::       -f enqueue=correct-sec-pillar.yml \\"
              echo "::error::       -f inputs_json='{\"dry_run\":\"false\"}' \\"
              echo "::error::       -f reason='commit lost to a conflict'"
              exit 1
            fi
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — main moved again; rebasing."
            sleep $((attempt * 3))
          done
          echo "::error::correct-sec-pillar: could not push after 5 attempts. The site"
          echo "::error::holds re-issued rows the committed database does not, so"
          echo "::error::re-queue it:"
          echo "::error::  gh workflow run drain-writers.yml \\"
          echo "::error::       -f enqueue=correct-sec-pillar.yml \\"
          echo "::error::       -f inputs_json='{\"dry_run\":\"false\"}' \\"
          echo "::error::       -f reason='commit lost to a racing push'"
          exit 1
