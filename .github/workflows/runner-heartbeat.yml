name: runner heartbeat

# Runs ON the self-hosted box and does nothing but succeed. Its most recent
# SUCCESSFUL run is the evidence runner_pick.py reads to decide whether the
# collectors run on the box or fall back to ubuntu-latest (coverage audit
# 2026-09-24: the box went offline on 09-23 and collection simply stopped).
#
# A box that is offline runs nothing, including this, and that absence IS the
# signal. `cancel-in-progress: true` so a dead box accumulates one pending
# heartbeat, not forty-eight. No checkout, no Python, no secrets: it must
# succeed whenever a job can start at all, and fail for no other reason.

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: [self-hosted, linux, contabo]
    timeout-minutes: 2
    steps:
      - name: Beat
        run: echo "runner alive at $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(hostname)"
