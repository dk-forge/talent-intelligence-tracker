name: collect

# The database is committed back to the repo after every run. That is
# deliberate: the repo is the system's memory, so any future session (human or
# agent) can diff what changed and reconstruct what we knew on any past date.

# ARMED 2026-07-27, after six live dry runs. Runs 06:00 and 18:00 UTC.
#
# The gate was: the key exists, and a human has read a live dry run and agreed
# it looks right. Six were read. They found and fixed, in order: the free filter
# killing every funding story, geography rejections discarding paid candidates,
# a prompt too timid to record a country, OpenRouter 429s counted as the model
# rejecting the story, a country vocabulary of 23 against 25 queried editions,
# and the publisher never reaching the classifier. The sixth run stored 11 of 14
# with 6 placed and nothing deferred.
#
# To disarm: comment the two schedule lines out again. Nothing else changes.
# Spend is capped independently — spend.py runs first and DEGRADES at 90% of
# the monthly allowance, switching paid reads off while the free collectors,
# the prefilter and both dedup layers carry on; it does not halt the job. (This
# line said "exits 1" for a week after the 2026-07-30 change that stopped it
# doing that.) DEFAULT_CANDIDATE_CAP bounds each run at 40 candidates.
on:
  schedule:
    # Once daily since 2026-08-14, the owner's call: the product updates daily,
    # a 24h freshness window is acceptable, and the second run cost ~$0.43/day
    # (~$13/month) at today's caps. Revisit after the model migration lands -
    # at migrated prices the second run costs ~$0.10/day and buys same-day
    # capture of morning announcements. This comment is the measured reason.
    - cron: '0 22 * * *'   # 22:00 UTC = 6 PM US Eastern (summer), once daily, AFTER the 4 PM close
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be stored, write nothing'
        type: boolean
        default: false
      source:
        description: 'Collector to run'
        type: choice
        # primary_chase is dispatch-only and never in the scheduled sweep: its
        # population is a hand-made list of URLs, so a cron would re-fetch
        # documents that have already been read. It is here so the run can be
        # QUEUED through drain-writers like every other database writer, rather
        # than dispatched past a pending run and evicted.
        options: [google_news, gdelt, sec_edgar, sec_form_d, primary_chase]
        default: google_news
      limit:
        description: 'Cap candidates sent to the LLM (blank = no cap)'
        type: string
        default: ''

# Two runs writing the database at once would race on the commit.
concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # SIZED FROM MEASUREMENT, 2026-08-13: median 20.0 min, max 101.5 over the
    # last 44 successful runs. Highly variable, and deliberately sized for the
    # tail rather than the middle: everything since 2026-08-03 sits between 12
    # and 27 minutes, but 2026-07-30 to 08-02 produced 67.3, 88.3, 96.2 and
    # 101.5, and a ceiling fitted to the quiet fortnight would redden a run that
    # was only slow. 180 is ~1.8x the honest maximum and ~9x the median, and
    # matches collect-structured.yml, the sibling collector on the same lock.
    #
    # It carried no ceiling at all until now, so it inherited GitHub's 6-hour
    # default while holding OPENROUTER_API_KEY. Spend is capped independently
    # (spend.py DEGRADES at 90% of the monthly allowance, DEFAULT_CANDIDATE_CAP
    # bounds each run at 40 candidates), so what this bounds is a HUNG RUN
    # sitting on a live key and on the single writer lock, not the bill.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/requirements.lock

      # Which of the two daily runs this is, so the segment matrix rotates
      # instead of re-running the same slice twice.
      - name: Pick run index
        id: idx
        # Block scalar, not a plain one: a shell ternary contains " : ", which
        # YAML would read as a mapping key and refuse to parse the file.
        # 10# forces base 10 — bash reads a leading-zero hour like 08 as octal.
        run: |
          hour=$((10#$(date -u +%H)))
          if [ "$hour" -ge 12 ]; then
            echo "value=1" >> "$GITHUB_OUTPUT"
          else
            echo "value=0" >> "$GITHUB_OUTPUT"
          fi

      # A budget that only warns is a forecast. This is the hard stop, and it
      # runs before any token is spent.
      # The ceiling DEGRADES, it does not halt. --degrade never fails this
      # step: past 90% of the monthly allowance it sets TIT_PAID_READS=off for
      # the rest of the job, so the free prefilter, deterministic extraction
      # and both dedup layers keep running and every candidate that would have
      # cost money defers UNMARKED for a later run. On 2026-07-30 --enforce
      # took the whole job red at $9.47 of $10 and nothing at all was
      # collected for the rest of the month; that is an outage protecting a
      # budget most of this pipeline does not spend.
      - name: Check the spend ceiling
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py --degrade

      # A scheduled run sweeps EVERY collector this workflow owns, because a
      # schedule that only ever names google_news is how gdelt, sec_edgar and
      # sec_form_d spent weeks reporting "ok" while nothing ran them: their two
      # manual runs each were the whole history, and the health page read a
      # dispatch somebody remembered as a source that was alive. A dispatch
      # keeps its single-source input, for reading one collector's run alone.
      #
      # run_collect takes exactly one --source per invocation, so the sweep is
      # a loop, and each invocation is a fresh process with its own read-
      # through cap. The per-source TIT_READTHROUGH_CAP is the cost control
      # that makes the sweep affordable, and since 2026-07-30 each number is
      # that collector's share of what the monthly allowance buys rather than
      # a round number: measured demand is 153 reads/run for google_news and
      # 26 for gdelt. The SEC pair keep 40, which is headroom on a demand of
      # one or two - rationing a collector that finds two filings saves
      # nothing and would one day bind on the run that finds fifty.
      #
      # google_news went 129 -> 99 on 2026-08-01, and it is a REALLOCATION,
      # not a cut: the total across the two collectors whose demand reaches
      # their cap is pinned at 217, and national_press takes the 118. The
      # split now follows measured conversion (google_news 761 reads -> 354
      # rows = 46.5%; national_press 288 -> 160 = 55.6%) instead of the pair
      # of numbers nobody chose, which is what 129 and an unset default were.
      # The rule and its arithmetic live in classify.read_cap; this number is
      # its output, and ops_status.py [3b] reads this case statement and warns
      # when the two disagree. A cap set here WINS over the rule, which is
      # deliberate (backfills need 5000) and is exactly why it can drift.
      #
      # The allowance is $5/month, not the $25 this comment used to cite. At
      # $5 the gate alone costs $4.41 and full coverage is $49.14, so these
      # caps are not what makes the budget fit and retuning them cannot make
      # it fit. See the cost discipline section in CLAUDE.md.
      #
      #     python3 cost_projection.py     # re-derives all four from the ledger
      #
      # Caps are ceilings, not spends. Which stories fit inside one is decided
      # by pipeline/candidate_rank.py, which puts the countries holding least
      # first and gives every country's best story a place before any
      # country's second. The spend guard above and the OpenRouter key's own
      # hard cap still bind before any of this.
      #
      # One source failing must not silence the ones behind it in the loop —
      # a dead GDELT costing us the SEC filings would be a new bug wearing a
      # sweep as a hat — so each failure is recorded and the step goes red
      # only after every source has had its run.
      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            overall=0
            for source in google_news gdelt sec_edgar sec_form_d; do
              case "$source" in
                gdelt)                export TIT_READTHROUGH_CAP=9 ;;
                sec_edgar|sec_form_d) export TIT_READTHROUGH_CAP=40 ;;
                google_news)          export TIT_READTHROUGH_CAP=99 ;;
                *)                    unset TIT_READTHROUGH_CAP ;;
              esac
              echo "::group::collect $source"
              python run_collect.py \
                --run-index "${{ steps.idx.outputs.value }}" \
                --publish \
                --source "$source" || overall=1
              echo "::endgroup::"
            done
            exit $overall
          fi
          python run_collect.py \
            --run-index "${{ steps.idx.outputs.value }}" \
            ${{ inputs.dry_run && '--dry-run' || '--publish' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            --source "${{ inputs.source || 'google_news' }}"

      - name: Status
        if: ${{ !inputs.dry_run }}
        run: python ops_status.py || true

      # A run checks out main, collects for several minutes, then pushes. Any
      # push to main in that window rejects it, and the records are gone: the
      # first armed run collected 28 and lost every one of them to a plugin
      # deploy that landed mid-collection. Six dry runs could never find this,
      # because a dry run writes nothing.
      #
      # Rebasing a SQLite file is not sensible, so this does not try. It resets
      # to the remote and MERGES this run's rows into whatever is there, with
      # merge_db.py.
      #
      # It used to copy our whole file back over the reset instead, on the
      # argument that the concurrency group made this the only writer. That
      # argument was wrong twice over, and it cost 9,572 signal rows and the
      # whole 3,604-row identity cache on 2026-07-28/29:
      #   * the lock only excludes other workflow RUNS, not a human or an agent
      #     committing the database from a laptop (9991861 -> e1bfb03);
      #   * and a run the lock serialises CORRECTLY is stale by construction —
      #     actions/checkout gives it the SHA pinned when it was dispatched, so
      #     the longer it waits in the queue the more it is about to overwrite
      #     (dispatched 01:05, ran 03:21, discarded 311 rows: d46fb10 -> 4d604f3).
      # The lock still matters, but only a merge is actually safe.
      #
      # The merge happens on EVERY attempt, not just after a rejected push, for
      # the second reason above: attempt 1 is already working from a possibly
      # stale checkout.
      # `!cancelled()` and not plain success: a run that FAILED after storing
      # and publishing rows still holds the only local record of them (new
      # signals + seen_urls). Skipping this step on failure threw that memory
      # away while WordPress kept the rows, so the next run re-fetched,
      # re-paid the LLM for, and re-published the same stories, and the live
      # site carried the duplicate (audit 2026-07-28, finding 1 — proven on
      # run 30310330200).
      - name: Commit the database
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          # spend_month.json is the month-start usage snapshot the spend guard
          # measures this month's delta against; it must persist the same way
          # the database does or the guard re-baselines every run.
          # data/gate_labels/ is this run's per-candidate gate verdicts, the
          # training set for the classifier that replaces most of the paid gate
          # (docs/PLAN-gate-to-five-dollars.md). `-A` and not a plain add: when
          # a month closes the ledger gzips the old shard and deletes the plain
          # one, and a deletion that is never staged is a file that comes back
          # on the next reset.
          git add data/talent_intel.db data/spend_month.json 2>/dev/null || git add data/talent_intel.db
          git add -A data/gate_labels 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          cp data/talent_intel.db "$RUNNER_TEMP/collected.db"
          cp data/spend_month.json "$RUNNER_TEMP/spend_month.json" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gate_labels"
          cp -R data/gate_labels "$RUNNER_TEMP/gate_labels" 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/collected.db" data/talent_intel.db
            cp "$RUNNER_TEMP/spend_month.json" data/spend_month.json 2>/dev/null || true
            # Appends only what main does not already hold, the same way
            # merge_db.py does, because the reset above discarded this run's
            # copy. It cannot fail the step: labels are bookkeeping and the
            # rows are not.
            python merge_gate_labels.py "$RUNNER_TEMP/gate_labels" data/gate_labels || true
            git add data/talent_intel.db data/spend_month.json 2>/dev/null || git add data/talent_intel.db
            git add -A data/gate_labels 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi
            git commit -q -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the database after 5 attempts. \
          This run's records exist only on the runner and are lost."
          exit 1
