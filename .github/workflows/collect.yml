name: collect

# The database is committed back to the repo after every run. That is
# deliberate: the repo is the system's memory, so any future session (human or
# agent) can diff what changed and reconstruct what we knew on any past date.

# ARMED 2026-07-27, after six live dry runs. Runs 06:00 and 18:00 UTC.
#
# The gate was: the key exists, and a human has read a live dry run and agreed
# it looks right. Six were read. They found and fixed, in order: the free filter
# killing every funding story, geography rejections discarding paid candidates,
# a prompt too timid to record a country, OpenRouter 429s counted as the model
# rejecting the story, a country vocabulary of 23 against 25 queried editions,
# and the publisher never reaching the classifier. The sixth run stored 11 of 14
# with 6 placed and nothing deferred.
#
# To disarm: comment the two schedule lines out again. Nothing else changes.
# Spend is capped independently — spend.py runs first and exits 1 at 90% of the
# monthly allowance, and DEFAULT_CANDIDATE_CAP bounds each run at 40 candidates.
on:
  schedule:
    - cron: '0 6,18 * * *'   # 06:00 and 18:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be stored, write nothing'
        type: boolean
        default: false
      source:
        description: 'Collector to run'
        type: choice
        options: [google_news, gdelt, sec_edgar, sec_form_d]
        default: google_news
      limit:
        description: 'Cap candidates sent to the LLM (blank = no cap)'
        type: string
        default: ''

# Two runs writing the database at once would race on the commit.
concurrency:
  # ONE lock for every workflow that writes data/talent_intel.db. These used to
  # sit in a separate 'collect' group from the backfills' 'talent-collect', so a
  # backfill and a collector could run at the same time - and both end with
  # reset-to-origin then copy-our-file-back, so whichever pushed second silently
  # destroyed the other's rows (found 2026-07-28).
  group: talent-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Which of the two daily runs this is, so the segment matrix rotates
      # instead of re-running the same slice twice.
      - name: Pick run index
        id: idx
        # Block scalar, not a plain one: a shell ternary contains " : ", which
        # YAML would read as a mapping key and refuse to parse the file.
        # 10# forces base 10 — bash reads a leading-zero hour like 08 as octal.
        run: |
          hour=$((10#$(date -u +%H)))
          if [ "$hour" -ge 12 ]; then
            echo "value=1" >> "$GITHUB_OUTPUT"
          else
            echo "value=0" >> "$GITHUB_OUTPUT"
          fi

      # A budget that only warns is a forecast. This is the hard stop, and it
      # runs before any token is spent.
      - name: Check the spend ceiling
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python spend.py --enforce

      # A scheduled run sweeps EVERY collector this workflow owns, because a
      # schedule that only ever names google_news is how gdelt, sec_edgar and
      # sec_form_d spent weeks reporting "ok" while nothing ran them: their two
      # manual runs each were the whole history, and the health page read a
      # dispatch somebody remembered as a source that was alive. A dispatch
      # keeps its single-source input, for reading one collector's run alone.
      #
      # run_collect takes exactly one --source per invocation, so the sweep is
      # a loop, and each invocation is a fresh process with its own read-
      # through cap. The per-source TIT_READTHROUGH_CAP is the cost control
      # that makes the sweep affordable: caps are ceilings, not spends — the
      # SEC collectors found 6 and 3 items on their last real runs, so their
      # 40 is headroom, while google_news keeps the production default (60).
      # The spend guard above and the OpenRouter key's own hard cap still
      # bind before any of this.
      #
      # One source failing must not silence the ones behind it in the loop —
      # a dead GDELT costing us the SEC filings would be a new bug wearing a
      # sweep as a hat — so each failure is recorded and the step goes red
      # only after every source has had its run.
      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            overall=0
            for source in google_news gdelt sec_edgar sec_form_d; do
              case "$source" in
                gdelt)                export TIT_READTHROUGH_CAP=100 ;;
                sec_edgar|sec_form_d) export TIT_READTHROUGH_CAP=40 ;;
                *)                    unset TIT_READTHROUGH_CAP ;;
              esac
              echo "::group::collect $source"
              python run_collect.py \
                --run-index "${{ steps.idx.outputs.value }}" \
                --publish \
                --source "$source" || overall=1
              echo "::endgroup::"
            done
            exit $overall
          fi
          python run_collect.py \
            --run-index "${{ steps.idx.outputs.value }}" \
            ${{ inputs.dry_run && '--dry-run' || '--publish' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            --source "${{ inputs.source || 'google_news' }}"

      - name: Status
        if: ${{ !inputs.dry_run }}
        run: python ops_status.py || true

      # A run checks out main, collects for several minutes, then pushes. Any
      # push to main in that window rejects it, and the records are gone: the
      # first armed run collected 28 and lost every one of them to a plugin
      # deploy that landed mid-collection. Six dry runs could never find this,
      # because a dry run writes nothing.
      #
      # Rebasing a SQLite file is not sensible, so this does not try. It resets
      # to the remote and MERGES this run's rows into whatever is there, with
      # merge_db.py.
      #
      # It used to copy our whole file back over the reset instead, on the
      # argument that the concurrency group made this the only writer. That
      # argument was wrong twice over, and it cost 9,572 signal rows and the
      # whole 3,604-row identity cache on 2026-07-28/29:
      #   * the lock only excludes other workflow RUNS, not a human or an agent
      #     committing the database from a laptop (9991861 -> e1bfb03);
      #   * and a run the lock serialises CORRECTLY is stale by construction —
      #     actions/checkout gives it the SHA pinned when it was dispatched, so
      #     the longer it waits in the queue the more it is about to overwrite
      #     (dispatched 01:05, ran 03:21, discarded 311 rows: d46fb10 -> 4d604f3).
      # The lock still matters, but only a merge is actually safe.
      #
      # The merge happens on EVERY attempt, not just after a rejected push, for
      # the second reason above: attempt 1 is already working from a possibly
      # stale checkout.
      # `!cancelled()` and not plain success: a run that FAILED after storing
      # and publishing rows still holds the only local record of them (new
      # signals + seen_urls). Skipping this step on failure threw that memory
      # away while WordPress kept the rows, so the next run re-fetched,
      # re-paid the LLM for, and re-published the same stories, and the live
      # site carried the duplicate (audit 2026-07-28, finding 1 — proven on
      # run 30310330200).
      - name: Commit the database
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name  'talent-intel-bot'
          git config user.email 'bot@users.noreply.github.com'
          # spend_month.json is the month-start usage snapshot the spend guard
          # measures this month's delta against; it must persist the same way
          # the database does or the guard re-baselines every run.
          git add data/talent_intel.db data/spend_month.json 2>/dev/null || git add data/talent_intel.db
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi

          cp data/talent_intel.db "$RUNNER_TEMP/collected.db"
          cp data/spend_month.json "$RUNNER_TEMP/spend_month.json" 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_db.py "$RUNNER_TEMP/collected.db" data/talent_intel.db
            cp "$RUNNER_TEMP/spend_month.json" data/spend_month.json 2>/dev/null || true
            git add data/talent_intel.db data/spend_month.json 2>/dev/null || git add data/talent_intel.db
            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi
            git commit -q -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — merging onto the current main."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the database after 5 attempts. \
          This run's records exist only on the runner and are lost."
          exit 1
